name: plasbench
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- data acquisition ---
  - ncbi-datasets-cli      # download complete assemblies + sequence reports
  - sra-tools>=3.0         # prefetch / fasterq-dump for Illumina reads
  - entrez-direct          # optional: metadata queries (esearch/efetch)
  # --- read QC + assembly ---
  - fastp                  # adapter/quality trimming
  - spades>=3.15           # provides spades.py AND plasmidspades.py
  - unicycler              # optional alternative assembler (cleaner graphs)
  # --- plasmid reconstruction tools under test ---
  # mob_suite is NOT in this environment: it needs pandas<=1.5.3, which breaks the
  # rest. env/setup_conda.sh installs it into its own pinned environment and puts
  # wrappers for mob_recon/mob_typer here (env/install_tools.sh mobsuite).
  - platon                 # contig-level plasmid classification
  # gplas is off by default (RUN_GPLAS2_MOB/RUN_GPLAS2_EXTERNAL); install it
  # separately with: plasbench install-tools gplas (see INSTALL.md)
  # --- scoring / mapping ---
  - minimap2               # align predicted plasmids back to the reference
  - samtools               # coverage/depth (RUN_DIFFICULTY_FEATURES; also convenience if you extend)
  - barrnap                # rRNA genes: chromosomal evidence for truth labelling
  - mash                   # plasmid-vs-chromosome k-mer distance (RUN_DIFFICULTY_FEATURES);
                            # (mob_suite has its own environment; see above)
  # --- glue ---
  - python>=3.9            # scoring scripts use the stdlib only
  - pip                    # install the PlasBench command-line wrapper
  - pigz                   # faster (de)compression
  - unzip                  # unpack the NCBI datasets archive in stage 1
# NOTE: the Python scoring scripts deliberately use ONLY the standard library,
# so they run even outside this env (any python3 >= 3.7).
