name: Tool installation proof

# Installs every tool PlasBench can install, one profile per job on a clean Linux runner, with the project's own commands
# (env/bootstrap_conda.sh, then `plasbench install-tools PROFILE --yes`), and then runs the profile's verification
# (config/install_proof.json: each tool's command must start; the registry's own verify_command is run too).
# The ordinary CI stays fast: installs are heavy (conda solves, source checkouts, several GB), so this runs weekly and on request, never on a pull request.
# Databases are not downloaded here (`plasbench check --yes` does that and is not part of installing a tool).
# A profile that cannot be installed automatically (plsmd, ppr-meta) must exit 20 with its reason: that is "expected manual", not a pass and not a failure.
# The last job writes one table of every profile to the run summary and fails when a profile that should install did not.

on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Profiles to prove: all, or a comma list such as "core,assembly,gplas2" (python/tool_install_proof.py profiles lists them)'
        required: false
        default: 'all'
      smoke:
        description: 'Also run the real-tool smoke job (installs fastp, spades, minimap2, samtools, mash, mob_suite and platon and runs them on a real plasmid)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - id: matrix
        env:
          REQUESTED: ${{ github.event.inputs.profiles || 'all' }}
        run: |
          python python/tool_install_proof.py check
          echo "profiles=$(python python/tool_install_proof.py profiles --only "$REQUESTED" --json)" >> "$GITHUB_OUTPUT"

  install:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.plan.outputs.profiles) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Free disk space (some environments are several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - run: python -m pip install --no-deps .
      # The project's own conda bootstrap installs Miniforge into ~/miniforge3 when no conda-family manager is on PATH (a runner has none on PATH).
      - name: Conda (env/bootstrap_conda.sh)
        run: |
          bash env/bootstrap_conda.sh --yes
          echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"
      # The main environment the installer expects. It starts nearly empty so that the profile under test is what puts its tools there.
      - name: Main environment
        run: |
          conda create -y -n plasbench -c conda-forge python=3.12 pip
          conda info
      - name: Install and verify ${{ matrix.profile }}
        run: |
          mkdir -p proof
          python python/tool_install_proof.py run "${{ matrix.profile }}" --out "proof/${{ matrix.profile }}.json"
      - name: Job summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os, pathlib
          path = pathlib.Path("proof/${{ matrix.profile }}.json")
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          if not path.exists():
              out.write("### ${{ matrix.profile }}: no result (the job stopped before the proof wrote one)\n")
          else:
              r = json.loads(path.read_text())
              out.write(f"### {r['profile']}: {r['status']} (exit {r['exit_code']}, {r['duration_seconds']} s)\n\n")
              out.write(f"{r.get('problem') or r.get('reason') or ''}\n\n")
              out.write("| command | exit | first line |\n| --- | --- | --- |\n")
              for v in r.get("verification", []):
                  out.write(f"| `{v['command']}` | {v['exit_code']} | {v['first_line'].replace('|', '/')} |\n")
              out.write("\n<details><summary>last 200 log lines</summary>\n\n```\n" + r.get("log_tail", "") + "\n```\n</details>\n")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: proof-${{ matrix.profile }}
          path: proof/
          if-no-files-found: warn

  summary:
    needs: [plan, install]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: proof-*
          path: proofs
          merge-multiple: true
        continue-on-error: true
      - name: Table of every profile
        env:
          PROOF_ONLY: ${{ needs.plan.outputs.profiles && join(fromJson(needs.plan.outputs.profiles), ',') }}
        run: |
          mkdir -p proofs
          python python/tool_install_proof.py aggregate proofs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: proof-summary
          path: proofs/summary.md

  smoke:
    # Real run: the tools this installs are then run on a real plasmid (pBR322) and a real stage 4/5 over it.
    if: github.event.inputs.smoke != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - run: python -m pip install --no-deps .
      - name: Conda (env/bootstrap_conda.sh)
        run: |
          bash env/bootstrap_conda.sh --yes
          echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"
      - name: Main environment
        run: conda create -y -n plasbench -c conda-forge python=3.12 pip
      - name: Install the tools the smoke run uses
        run: |
          plasbench install-tools core --yes
          plasbench install-tools assembly --yes
          plasbench install-tools utilities --yes
          plasbench install-tools mobsuite --yes
          plasbench install-tools reconstruction --yes
      - name: Real run
        run: bash test/real_run_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: smoke-run
          path: |
            smoke_work/results/tool_status.tsv
            smoke_work/results/scores.tsv
            smoke_work/logs/
          if-no-files-found: warn
