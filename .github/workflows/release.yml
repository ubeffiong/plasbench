name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: version
        name: Validate release version and build install archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("could not read project version")
          print(match.group(1))
          PY
          )"
          test "$VERSION" = "$PACKAGE_VERSION"
          bash scripts/make_release.sh
          (cd dist && sha256sum -c "plasbench-${VERSION}.tar.gz.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/plasbench:${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/plasbench:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/plasbench:latest
      # Quay publishing is optional. Add QUAY_USERNAME and QUAY_ROBOT_TOKEN
      # repository secrets, then add a quay.io login and a second image tag here.
      # A published GitHub Release (not just a pushed tag) is what Zenodo's
      # own GitHub integration archives -- see RELEASING.md. This step is what
      # actually makes that zero-code mirror fire for every tag.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/RELEASE_TEMPLATE.md
          files: |
            dist/plasbench-${{ steps.version.outputs.version }}.tar.gz
            dist/plasbench-${{ steps.version.outputs.version }}.tar.gz.sha256
          fail_on_unmatched_files: true
