name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      # continue-on-error: the plasbench project does not exist on PyPI yet
      # (no Trusted Publisher has been registered there -- see RELEASING.md).
      # A step failure otherwise skips every step after it in this job, which
      # would silently take the GHCR image push and the GitHub Release below
      # down with it every time this fails. Once a Trusted Publisher is
      # registered at pypi.org/manage/account/publishing/ for this repo and
      # workflow, this step starts succeeding and this comment can go.
      - uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/plasbench:${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/plasbench:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/plasbench:latest
      # Quay publishing is optional. Add QUAY_USERNAME and QUAY_ROBOT_TOKEN
      # repository secrets, then add a quay.io login and a second image tag here.
      # A published GitHub Release (not just a pushed tag) is what Zenodo's
      # own GitHub integration archives -- see RELEASING.md. This step is what
      # actually makes that zero-code mirror fire for every tag.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
