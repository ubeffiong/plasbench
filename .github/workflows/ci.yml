name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: 'scripts adapters env test'
          # Pinned: the action's default "stable" download currently fails to
          # extract, which skips shellcheck entirely.
          version: v0.10.0
      - run: python -m pip install --no-deps .
      - run: plasbench test
      - run: plasbench demo
      - run: python -m compileall -q python plasbench
      - run: python -m pip install build twine
      - run: python -m build
      # Only distributions: `plasbench test` leaves a release-archive .sha256
      # in dist/, which twine rejects as an unknown distribution format.
      - run: python -m twine check dist/*.whl dist/*.tar.gz
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: plasbench:ci
      - run: docker run --rm plasbench:ci plasbench demo
