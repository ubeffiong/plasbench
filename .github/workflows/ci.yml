name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: 'scripts adapters env test'
      - run: python -m pip install --no-deps .
      - run: plasbench test
      - run: plasbench demo
      - run: python -m compileall -q python plasbench
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: plasbench:ci
