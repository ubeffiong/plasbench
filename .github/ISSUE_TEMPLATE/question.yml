name: Question
description: Ask how to use PlasBench, how to read a result, or how something works. Not for bugs or security problems.
title: "Question: <short description>"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [README](https://github.com/ubeffiong/plasbench/blob/main/README.md), the [FAQ](https://github.com/ubeffiong/plasbench/blob/main/FAQ.md) and the
        [User Guide](https://github.com/ubeffiong/plasbench/blob/main/docs/USER_GUIDE.md) first, and search the existing issues.
        If something fails with an error message, use the Bug report form instead.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: "What are you trying to do, and what is unclear? If you ran a command, paste it exactly and the output you got."
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already tried or read
      description: Pages, commands, or settings you have already looked at.
  - type: input
    id: version
    attributes:
      label: PlasBench version
      description: "The output of `plasbench --version`."
      placeholder: "plasbench 0.5.8"
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Ubuntu / Linux
        - WSL2 (Windows Subsystem for Linux)
        - Windows native (PowerShell)
        - macOS
        - Docker mode
        - Other
