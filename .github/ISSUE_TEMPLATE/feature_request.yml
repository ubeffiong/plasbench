name: Feature request
description: Suggest a new tool, metric, command, report section or window feature.
title: "Feature: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search the [existing issues](https://github.com/ubeffiong/plasbench/issues?q=is%3Aissue) first. One request per issue.
        Something is broken rather than missing? Use the Bug report form. A question? Use the Question form.
  - type: textarea
    id: problem
    attributes:
      label: The problem you want solved
      description: "What can you not do today, or what is hard? Start with: When I ... I cannot ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: "The behaviour you want: the command, option or page, and what it should print or show."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: Any workaround, other tool, or alternative design you considered.
  - type: input
    id: version
    attributes:
      label: PlasBench version
      description: "The output of `plasbench --version`."
      placeholder: "plasbench 0.5.6"
  - type: checkboxes
    id: checklist
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not already requested.
          required: true
