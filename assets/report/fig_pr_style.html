<style>
/* Precision-recall figure. Same look as the plasmid map viewer (pv-*) and the 3D views (v3-*): plot large on the left, collapsible tabbed panel on the right.
   The static Python-rendered view (.pr-static) is the no-JavaScript and print fallback; it is hidden once the live figure starts. */
.pr-root{margin:12px 0;font:13px/1.4 Arial,Helvetica,sans-serif;color:var(--ink,#17231d);position:relative}
.pr-root *{box-sizing:border-box}
.pr-root.pr-live .pr-static{display:none}
.pr-static-track{margin:14px 0}
.pr-static-track h3{margin:0 0 6px}
.pr-static svg{display:block;width:100%;height:auto;max-width:760px;margin:auto}
.pr-nocurve{margin:8px 0;padding-left:18px;font-size:12.5px}
.pr-app{border:1px solid var(--line,#d9e1da);border-radius:10px;background:var(--card,#fff);overflow:hidden}
.pr-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line,#d9e1da)}
.pr-trackbar{display:flex;flex-wrap:wrap;gap:4px}
.pr-sum{flex:1 1 240px;min-width:200px;color:var(--muted,#627067)}
.pr-btn{border:1px solid #b9c5bd;background:#fff;color:var(--ink,#17231d);border-radius:6px;padding:5px 10px;cursor:pointer;font:600 12px Arial,sans-serif;line-height:1.2}
.pr-btn:hover{background:#eef4ef}
.pr-btn[aria-pressed=true]{background:var(--green,#0c6b4f);color:#fff;border-color:var(--green,#0c6b4f)}
.pr-root :focus-visible{outline:3px solid #1a5fb4;outline-offset:2px}
.pr-notrun{margin:0;padding:8px 14px;background:#fbf0d8;border-bottom:1px solid #d9c38a}
.pr-main{display:grid;grid-template-columns:minmax(0,1fr) 430px;background:#fff}
.pr-main.pr-nopanel{grid-template-columns:minmax(0,1fr)}
.pr-main.pr-nopanel .pr-panel{display:none}
.pr-stage{min-width:0;padding:8px 12px 10px}
.pr-toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.pr-toolbar .pr-sp{flex:1}
.pr-plotwrap{position:relative}
.pr-svg{display:block;width:100%;height:auto;max-height:84vh;background:#fff;border-radius:6px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.pr-hit{cursor:pointer}
.pr-hit:focus,.pr-svg:focus{outline:none}
.pr-svg:focus-visible{outline:3px solid #1a5fb4;outline-offset:2px}
.pr-tip{position:absolute;z-index:5;max-width:300px;background:#14211b;color:#fff;border-radius:8px;padding:8px 10px;font:12px/1.35 Arial,sans-serif;pointer-events:none;box-shadow:0 4px 14px #0005}
.pr-tip[hidden]{display:none}
.pr-tip strong{display:block;font-size:13px;margin-bottom:3px}
.pr-tip dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:0}
.pr-tip dt{color:#b8cbc0}.pr-tip dd{margin:0}
.pr-tip em{display:block;margin-top:4px;color:#d9e7de;font-size:11px}
.pr-legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.pr-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #b9c5bd;border-radius:14px;background:#fff;padding:3px 10px;font:12px Arial,sans-serif;cursor:pointer;color:var(--ink,#17231d)}
.pr-chip-n{font-weight:700}
.pr-chip-v{color:var(--muted,#627067)}
.pr-chip[aria-pressed=false]{background:#f2f2f2;color:#6b6b6b}
.pr-chip[aria-pressed=false] .pr-chip-n{text-decoration:line-through}
.pr-chip[aria-pressed=true]{border-color:var(--ink,#17231d);box-shadow:0 0 0 1px var(--ink,#17231d) inset}
.pr-panel{border-left:1px solid var(--line,#d9e1da);background:#fbfcfb;position:relative;min-height:0}
.pr-panel-in{display:flex;flex-direction:column;height:100%;max-height:760px}
.pr-tabs{display:flex;flex-wrap:wrap;gap:3px;padding:6px;border-bottom:1px solid var(--line,#d9e1da);background:#f1f5f1}
.pr-tab{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 9px;cursor:pointer;font:600 12px Arial,sans-serif;color:var(--ink,#17231d)}
.pr-tab:hover{background:#e3ece5}
.pr-tab[aria-selected=true]{background:var(--green,#0c6b4f);color:#fff}
.pr-tabbody{overflow:auto;padding:10px 12px 14px;flex:1;min-height:0}
.pr-tabbody h4{margin:12px 0 6px;font:700 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#627067)}
.pr-tabbody h4:first-child{margin-top:0}
.pr-row{display:flex;align-items:center;gap:6px 10px;margin:3px 0;flex-wrap:wrap}
.pr-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.pr-root select,.pr-num{border:1px solid #b9c5bd;border-radius:6px;padding:5px 8px;font:13px Arial,sans-serif;background:#fff;color:var(--ink,#17231d);max-width:100%}
.pr-num{width:70px}
.pr-lbl{min-width:120px}
.pr-tools-list{max-height:200px;overflow:auto;border:1px solid var(--line,#d9e1da);border-radius:6px;padding:4px 8px;background:#fff}
.pr-muted{color:var(--muted,#627067);font-size:12px}
.pr-list{margin:4px 0;padding-left:18px;font-size:12px}
.pr-tw{overflow:auto;max-height:420px;border:1px solid var(--line,#d9e1da);border-radius:6px;background:#fff}
.pr-root table{min-width:0;width:100%;border-collapse:collapse}
.pr-root th,.pr-root td{white-space:normal;padding:4px 6px;text-align:left;vertical-align:top;border-top:1px solid var(--line,#d9e1da);font-size:11.5px}
.pr-root th{background:#edf2ec;font-size:10.5px;text-transform:none;letter-spacing:0;position:sticky;top:0;z-index:1}
.pr-root th button{all:unset;cursor:pointer;font-weight:700}
.pr-root th[aria-sort=ascending] button::after{content:" \25B2";font-size:9px}
.pr-root th[aria-sort=descending] button::after{content:" \25BC";font-size:9px}
.pr-r{cursor:pointer}
.pr-r:hover td{background:#f1f7f2}
.pr-dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0;font-size:12.5px}
.pr-dl dt{color:var(--muted,#627067);font-weight:600}.pr-dl dd{margin:0;word-break:break-word}
.pr-detail-h{margin:0 0 2px;font:700 16px Arial,sans-serif}
@media(max-width:900px){.pr-main{grid-template-columns:1fr}.pr-panel{border-left:0;border-top:1px solid var(--line,#d9e1da)}.pr-panel-in{max-height:none}}
@media print{.pr-root.pr-live .pr-static{display:block}.pr-app{display:none}}
@media(prefers-reduced-motion:reduce){.pr-root *{transition:none!important;animation:none!important}}
</style>
