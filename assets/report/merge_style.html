<style id='rpt-merge-style'>
/* report_merge: a container section holds related analyses as tabs. Without JavaScript every panel shows stacked, each under its tab name;
   print shows them all. */
.rpt-mtabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--line,#d5ddd6);margin:14px 0 14px;font-family:Arial,sans-serif}
.rpt-mtabs[hidden]{display:none}
.rpt-mtabs [role=tab]{appearance:none;background:transparent;border:0;border-bottom:3px solid transparent;margin:0 0 -2px;padding:8px 13px;font:600 13px/1.3 Arial,sans-serif;color:var(--muted,#536158);cursor:pointer;border-radius:6px 6px 0 0}
.rpt-mtabs [role=tab]:hover{background:rgba(23,75,58,.06);color:var(--ink,#15241c)}
.rpt-mtabs [role=tab][aria-selected=true]{color:var(--ink,#15241c);border-bottom-color:var(--green,#174b3a);background:rgba(23,75,58,.05)}
.rpt-mtabs [role=tab]:focus-visible{outline:2px solid var(--ink,#15241c);outline-offset:-2px}
.rpt-panel[hidden]{display:none}
.rpt-panel{scroll-margin-top:calc(var(--top-h,56px) + 12px)}
/* a panel names itself by its tab; the section heading inside it is a sub-heading */
.rpt-merge .rpt-panel>h2:first-child,.rpt-merge .rpt-panel>h3:first-child{font:700 15px/1.3 Arial,sans-serif;margin:2px 0 8px}
.rpt-merge:not(.rpt-on)>.rpt-panel::before{content:attr(data-tab);display:block;font:700 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#536158);margin:0 0 6px}
.rpt-merge:not(.rpt-on)>.rpt-panel+.rpt-panel{border-top:2px solid var(--line,#d5ddd6);margin-top:20px;padding-top:14px}
.rpt-xlink{margin:0 0 10px;font:13px/1.45 Arial,sans-serif;color:var(--muted,#536158)}
@media print{
 .rpt-mtabs{display:none!important}
 .rpt-panel,.rpt-panel[hidden]{display:block!important}
 .rpt-merge .rpt-panel::before{content:attr(data-tab);display:block;font:700 8pt Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#555;margin:0 0 2mm}
 .rpt-merge .rpt-panel+.rpt-panel{border-top:1px solid #999;margin-top:6mm;padding-top:4mm}
}
</style>
