<script>
/* PlasBench 3D views: scene builders (pure functions, testable in node) and the thin glue that mounts them.
   Hosts look like <div class="v3" data-v3="bars|recs|rings" data-src="id-of-json-script">. */
(function (root) {
'use strict';
var P = root.PB3D, esc = P.esc, fmt = P.fmt;
var OI = {blue: '#0072B2', orange: '#E69F00', green: '#009E73', purple: '#CC79A7', vermillion: '#D55E00', sky: '#56B4E9', ink: '#17231d', grey: '#8c8c8c'};
var PLACE = {
  correct_plasmid: {label: 'Correct plasmid', color: OI.green, shape: 'circle'},
  wrong_plasmid: {label: 'Wrong plasmid', color: OI.vermillion, shape: 'cross'},
  shared_contig: {label: 'Shared contig', color: OI.orange, shape: 'diamond'},
  unassigned_contig: {label: 'Unassigned contig', color: OI.sky, shape: 'square'},
  not_recovered: {label: 'Not recovered', color: '#555555', shape: 'ring'}
};
var PLACE_ORDER = ['correct_plasmid', 'wrong_plasmid', 'shared_contig', 'unassigned_contig', 'not_recovered'];

function floorAndWalls(prims, xmin, xmax, zmin, zmax, H, ticks) {
  prims.push({k: 'poly', role: 'floor', layer: 0, cls: 'v3-floor', pts: [[xmin, 0, zmax], [xmax, 0, zmax], [xmax, 0, zmin], [xmin, 0, zmin]]});
  for (var t = 0; t <= ticks; t++) {
    var y = H * t / ticks;
    prims.push({k: 'line', role: 'grid', layer: 0, cls: 'v3-grid', pts: [[xmin, y, zmin], [xmax, y, zmin]]});
    prims.push({k: 'line', role: 'grid', layer: 0, cls: 'v3-grid', pts: [[xmin, y, zmin], [xmin, y, zmax]]});
    prims.push({k: 'text', role: 'ytick', layer: 2, cls: 'v3-t-m', p: [xmin, y, zmax], t: (t / ticks).toFixed(2).replace(/0$/, ''), anchor: 'end', dx: -7, dy: 4});
  }
  prims.push({k: 'line', role: 'axis', layer: 0, cls: 'v3-axis', pts: [[xmin, 0, zmax], [xmin, H, zmax]]});
  prims.push({k: 'line', role: 'axis', layer: 0, cls: 'v3-axis', pts: [[xmin, 0, zmax], [xmax, 0, zmax]]});
  prims.push({k: 'line', role: 'axis', layer: 0, cls: 'v3-axis', pts: [[xmax, 0, zmin], [xmax, 0, zmax]]});
}
function addBox(prims, o) {
  P.boxFaces(o.x - o.w / 2, o.x + o.w / 2, 0, o.h, o.z - o.d / 2, o.z + o.d / 2).forEach(function (f) {
    prims.push({k: 'poly', role: o.role || 'bar', cls: 'v3-bar', pts: f[1], fill: o.fill, shade: f[2], cull: true, id: o.id, grp: o.grp, focus: f[0] === 'top', label: o.label, op: o.op});
  });
}

/* ================================================================ view 1: contig layer bars */
function barsDefaults(data) { return {group: '', layer: ''}; }
function buildBars(data, o) {
  o = o || {}; var hid = o.hidden || {};
  var tools = data.tools.filter(function (t) { return !o.group || t.group === o.group; });
  var layers = data.layers.filter(function (l) { return !hid['L:' + l.key] && (!o.layer || o.layer === l.key); });
  var nx = tools.length, nz = layers.length;
  var scene = {prims: [], legend: [], tips: {}, title: 'Contig layer beside the reference layer: 3D bar chart',
    desc: 'Bars: x is the tool, depth is the scoring layer, height is the score from 0 to 1. Markers show the independent k-mer scorer.'};
  if (!nx || !nz) return scene;
  var gx = 1.7, gz = 1.9, bw = 1.05, H = 4, prims = scene.prims;
  var xmin = -1.1, xmax = (nx - 1) * gx + 1.1, zmin = -1.1, zmax = (nz - 1) * gz + 1.1;
  floorAndWalls(prims, xmin, xmax, zmin, zmax, H, 4);
  for (var i = 0; i < nx; i++) prims.push({k: 'line', role: 'grid', layer: 0, cls: 'v3-grid', pts: [[i * gx, 0, zmin], [i * gx, 0, zmax]]});
  for (var j = 0; j < nz; j++) prims.push({k: 'line', role: 'grid', layer: 0, cls: 'v3-grid', pts: [[xmin, 0, j * gz], [xmax, 0, j * gz]]});
  tools.forEach(function (t, i) {
    prims.push({k: 'text', role: 'xlabel', layer: 2, cls: 'v3-t-b', p: [i * gx, 0, zmax + 0.15], t: t.label, anchor: nx > 5 ? 'end' : 'middle', dy: 16, rot: nx > 5 ? -28 : 0});
  });
  layers.forEach(function (l, j) {
    prims.push({k: 'text', role: 'zlabel', layer: 2, cls: 'v3-t-b', p: [xmax + 0.1, 0, j * gz], t: l.label, anchor: 'start', dx: 8, dy: 4});
  });
  prims.push({k: 'text', role: 'axtitle', layer: 2, cls: 'v3-t-m v3-ital', p: [xmin, H, zmax], t: 'Score (0 to 1)', anchor: 'end', dx: -4, dy: -12});
  var labelled = nx * nz <= 40, anyXc = false;
  tools.forEach(function (t, i) {
    layers.forEach(function (l, j) {
      var x = i * gx, z = j * gz, v = t.v[l.key], id = 'b|' + t.id + '|' + l.key, grp = 't|' + t.id;
      if (v == null) {
        prims.push({k: 'poly', role: 'na', cls: 'v3-na', pts: [[x - bw / 2, 0.03, z + bw / 2], [x + bw / 2, 0.03, z + bw / 2], [x + bw / 2, 0.03, z - bw / 2], [x - bw / 2, 0.03, z - bw / 2]],
          fill: '#999999', op: 0.12, id: id, grp: grp, focus: true, label: t.label + ', ' + l.label + ': not scored'});
        scene.tips[id] = {t: t.label + ' / ' + l.label, rows: [['Value', 'not scored at this layer']], note: l.def};
        return;
      }
      var h = Math.max(v * H, 0.02);
      addBox(prims, {x: x, z: z, w: bw, d: bw, h: h, fill: l.color, id: id, grp: grp, label: t.label + ', ' + l.label + ': ' + fmt(v)});
      if (labelled) prims.push({k: 'text', role: 'value', layer: 2, cls: 'v3-t-b', size: 10, p: [x, h, z], t: fmt(v, 2), dy: -7});
      var tip = {t: t.label + ' / ' + l.label, rows: [['Value', fmt(v, 4)]], note: l.def};
      var xc = t.xc, iv = xc ? (l.key === 'contig_f1' ? xc.f1 : l.key === 'contig_mcc' ? xc.mcc : null) : null;
      if (xc && iv != null && !hid.xc) {
        anyXc = true;
        var dis = xc.dis > 0, d = l.key === 'contig_f1' ? xc.d_f1 : xc.d_mcc;
        prims.push({k: 'line', role: 'xcwhisker', cls: 'v3-xcw', pts: [[x, h, z], [x, iv * H, z]], stroke: dis ? OI.vermillion : '#222222', w: 2, op: 0.9});
        prims.push({k: 'mark', role: 'xc', p: [x, iv * H, z], bias: 0.05, shape: dis ? 'triangle' : 'diamond', r: 6, fill: dis ? OI.vermillion : '#ffffff', stroke: '#111111', id: 'x|' + t.id + '|' + l.key, grp: grp});
        scene.tips['x|' + t.id + '|' + l.key] = {t: 'Independent k-mer scorer: ' + t.label + ' / ' + l.label,
          rows: [['k-mer scorer', fmt(iv, 4)], ['Delta vs minimap2', fmt(d, 4)], ['Status', dis ? 'DISAGREE (' + xc.dis + ' of ' + xc.n + ' samples beyond ' + data.thr + ')' : 'agree within ' + data.thr], ['Samples cross-checked', xc.n]], note: 'Diamond = agrees, triangle = flagged.'};
        tip.rows.push(['k-mer scorer (independent)', fmt(iv, 4)], ['Delta vs minimap2', fmt(d, 4)], ['Cross-check', dis ? 'flagged: disagree' : 'agrees']);
      }
      scene.tips[id] = tip;
    });
  });
  data.layers.forEach(function (l) { scene.legend.push({group: 'Layer (click to hide)', key: 'L:' + l.key, label: l.label, color: l.color, shape: 'square', title: l.def}); });
  scene.legend.push({group: 'Independent scorer', key: 'xc', label: 'Agrees (diamond)', color: '#ffffff', shape: 'diamond'}, {group: 'Independent scorer', key: 'xc', label: 'Flagged: disagrees (triangle)', color: OI.vermillion, shape: 'triangle'});
  return scene;
}
function barsControls(data, vals) {
  var groups = [['', 'All tracks / tasks']].concat(data.groups.map(function (g) { return [g, g]; })), out = [];
  if (data.groups.length > 1) out.push({key: 'group', label: 'Track / task', options: groups});
  out.push({key: 'layer', label: 'Layer', options: [['', 'All four layers']].concat(data.layers.map(function (l) { return [l.key, l.label]; }))});
  return out;
}
function barsSide(data) {
  return '<div class="v3-card"><h3>Excluded from contig scoring</h3><p class="v3-big">' + data.shared.toLocaleString('en-US') + ' bp <span>shared (AMBIGUOUS)</span></p><p class="v3-big">' +
    data.unassigned.toLocaleString('en-US') + ' bp <span>unassigned (UNPLACED)</span></p><p class="v3-muted">Summed over every scored run. These contigs are left out of the contig layer rather than counted wrong.</p></div>' +
    '<div class="v3-card"><h3>Independent second scorer</h3><p>' + esc(data.xcStatus) + ': ' + esc(data.xcBasis) + '.</p></div>';
}
function barsToolRows(data, id) {
  var t = data.tools.filter(function (x) { return x.id === id; })[0];
  return {tool: t, rows: t ? data.xcRows.filter(function (r) { return r[1] === t.tool; }) : []};
}
function barsPanel(data, vals, grp) {
  var id = grp.split('|')[1], tr = barsToolRows(data, id), t = tr.tool; if (!t) return null;
  var vrows = data.layers.map(function (l) { return [l.label, t.v[l.key] == null ? 'not scored' : fmt(t.v[l.key], 4)]; });
  var html = P.tableHTML(['Layer', 'Mean value'], vrows) + '<p class="v3-muted">Excluded for this tool: shared ' + t.ex.shared.toLocaleString('en-US') + ' bp, unassigned ' + t.ex.unassigned.toLocaleString('en-US') + ' bp.</p>';
  var tabs = [{name: 'Per-sample cross-check', html: tr.rows.length ? P.tableHTML(data.xcHeader, tr.rows) : '<p class="v3-muted">No independent-scorer rows for this tool in this run.</p>',
    csv: tr.rows.length ? {name: 'contig_crosscheck_' + t.tool + '.csv', header: data.xcHeader, rows: tr.rows} : null}, allRowsTab(data)];
  return {title: t.label, html: html, tabs: tabs};
}
function allRowsTab(data) {
  return {name: 'All cross-check rows', html: data.xcRows.length ? P.tableHTML(data.xcHeader, data.xcRows) : '<p class="v3-muted">No independent scorer ran (RUN_CONTIG_CROSSCHECK=0 or no contig labels).</p>',
    csv: data.xcRows.length ? {name: 'contig_crosscheck_all.csv', header: data.xcHeader, rows: data.xcRows} : null};
}
function barsPanelDefault(data) { return {title: 'Click a tool to drill down', html: '<p class="v3-muted">Click any bar of a tool (or focus it and press Enter) to see its per-sample cross-check rows.</p>', tabs: [allRowsTab(data)]}; }

/* ================================================================ view 2: recommender strategies */
var RI = {S: 0, ORG: 1, STUDY: 2, RT: 3, RS: 4, PS: 5, BT: 6, BS: 7, RG: 8, NEAR: 9, ST: 10, SS: 11, SR: 12, FL: 13, BASIS: 14};
var STRATS = [{key: 'rec', label: 'Per-isolate recommender', color: OI.blue, col: RI.RS}, {key: 'single', label: 'Single best tool', color: OI.orange, col: RI.SS}, {key: 'oracle', label: 'Oracle best tool', color: OI.green, col: RI.BS}];
function recsDefaults(data) { return {profile: data.profiles.length ? data.profiles[0].p : ''}; }
function buildRecs(data, o) {
  o = o || {}; var hid = o.hidden || {}, rows = (data.iso && data.iso[o.profile]) || [];
  var strs = STRATS.filter(function (s) { return !hid['S:' + s.key]; }), nx = rows.length, nz = strs.length;
  var scene = {prims: [], legend: [], tips: {}, title: 'Recommender strategies per isolate: 3D bar chart',
    desc: 'Bars: x is the isolate, depth is the strategy (recommender, single best tool, oracle), height is the score. Dashed segments are regret gaps.'};
  if (!nx || !nz) return scene;
  var gx = 1.2, gz = 2.5, bw = 0.7, H = 4, prims = scene.prims;
  var xmin = -1, xmax = (nx - 1) * gx + 1, zmin = -1.1, zmax = (nz - 1) * gz + 1.1;
  floorAndWalls(prims, xmin, xmax, zmin, zmax, H, 4);
  strs.forEach(function (s, j) {
    var zz = (nz - 1 - j) * gz;
    prims.push({k: 'line', role: 'grid', layer: 0, cls: 'v3-grid', pts: [[xmin, 0, zz], [xmax, 0, zz]]});
    prims.push({k: 'text', role: 'zlabel', layer: 2, cls: 'v3-t-b', p: [xmax + 0.1, 0, zz], t: s.label, anchor: 'start', dx: 8, dy: 4});
  });
  var many = nx > 5;
  rows.forEach(function (r, i) {
    var x = i * gx, grp = 'i|' + i;
    prims.push({k: 'text', role: 'xlabel', layer: 2, cls: 'v3-t-b', p: [x, 0, zmax + 0.15], t: r[RI.S], anchor: many ? 'end' : 'middle', dy: 16, rot: many ? -35 : 0});
    var tops = [];
    strs.forEach(function (s, j) {
      var v = r[s.col], z = (nz - 1 - j) * gz, id = 's|' + i + '|' + s.key;
      if (v == null) return;
      addBox(prims, {x: x, z: z, w: bw, d: bw, h: Math.max(v * H, 0.02), fill: s.color, id: id, grp: grp, label: r[RI.S] + ', ' + s.label + ': ' + fmt(v)});
      tops.push([x, v * H, z]);
      var tip = {t: r[RI.S] + ' / ' + s.label, rows: []};
      if (s.key === 'rec') tip.rows.push(['Tool picked', r[RI.RT] || '-'], ['Predicted score', fmt(r[RI.PS], 4)], ['Achieved score', fmt(v, 4)], ['Regret', fmt(r[RI.RG], 4)], ['Near-optimal', r[RI.NEAR] === 'yes' ? 'yes' : 'no'], ['Floor flagged', r[RI.FL] === 'yes' ? 'yes' : 'no']);
      else if (s.key === 'single') tip.rows.push(['Tool', r[RI.ST] || '-'], ['Achieved score', fmt(v, 4)], ['Regret', fmt(r[RI.SR], 4)]);
      else tip.rows.push(['Best tool on this isolate', r[RI.BT] || '-'], ['Score', fmt(v, 4)]);
      tip.note = 'Click for the isolate detail.'; scene.tips[id] = tip;
      if (s.key === 'rec') {
        var near = r[RI.NEAR] === 'yes';
        prims.push({k: 'mark', role: 'near', p: [x, v * H, z], bias: 0.05, shape: near ? 'circle' : 'triangle', r: 5.5, fill: near ? '#ffffff' : OI.vermillion, stroke: '#111111', id: id, grp: grp});
        if (r[RI.FL] === 'yes') prims.push({k: 'mark', role: 'floorflag', p: [x, v * H, z], bias: 0.04, shape: 'ring', r: 10, fill: '#111111', id: id, grp: grp});
      }
      var bs = r[RI.BS], gap = s.key === 'rec' || s.key === 'single' ? (bs != null ? bs - v : 0) : 0;
      if (gap > 1e-9) prims.push({k: 'line', role: 'regret', cls: 'v3-regret', cap: true, pts: [[x, v * H, z], [x, bs * H, z]], stroke: OI.vermillion, w: 3, dash: '5 3', id: id, grp: grp});
    });
    for (var q = 0; q + 1 < tops.length; q++) {
      var a = tops[q], b = tops[q + 1];
      prims.push({k: 'poly', role: 'ribbon', cls: 'v3-ribbon', pts: [[a[0] - 0.12, a[1], a[2]], [a[0] + 0.12, a[1], a[2]], [b[0] + 0.12, b[1], b[2]], [b[0] - 0.12, b[1], b[2]]], fill: '#5b6f86', op: 0.65, grp: grp});
    }
  });
  STRATS.forEach(function (s) { scene.legend.push({group: 'Strategy (click to hide)', key: 'S:' + s.key, label: s.label, color: s.color, shape: 'square'}); });
  scene.legend.push({group: 'Markers', static: true, label: 'Recommendation near-optimal', color: '#17231d', shape: 'ring'}, {group: 'Markers', static: true, label: 'Not near-optimal', color: OI.vermillion, shape: 'triangle'},
    {group: 'Markers', static: true, label: 'Regret gap to the oracle (dashed)', color: OI.vermillion, shape: 'line'}, {group: 'Markers', static: true, label: 'Ribbon joins the three strategies', color: '#5b6f86', shape: 'square'});
  return scene;
}
function profRow(data, p) { return data.profiles.filter(function (x) { return x.p === p; })[0] || null; }
function verdictWords(v, pr) {
  var gap = v.oracle_gap == null || v.oracle_gap === '' ? 'n/a' : v.oracle_gap, closed = v.gap_closed == null || v.gap_closed === '' ? 'not defined' : (Math.round(v.gap_closed * 1000) / 10) + '%';
  var floor = v.oracle_gap_floor != null ? v.oracle_gap_floor : 0.02;
  switch (v.verdict) {
    case 'benchmark_only': return ['neutral', '■', 'Use the leaderboard: recommending per isolate cannot add value here.', 'The best single tool is already within ' + gap + ' F1 of the per-isolate oracle, below the ' + floor + ' floor, so choosing a tool per isolate has nothing left to gain.'];
    case 'recommender_adds_value': return ['good', '●', 'Recommending per isolate beats the single best tool.', 'It closes ' + closed + ' of the gap to the oracle (oracle gap ' + gap + ' F1).'];
    case 'recommender_no_better': return ['caution', '▲', 'Recommending per isolate does not beat the single best tool.', 'Gap closed ' + closed + ' of an oracle gap of ' + gap + ' F1: use the single best tool.'];
    default: return ['neutral', '○', 'Verdict not assessed.', v.note || 'The evaluation did not reach a verdict.'];
  }
}
function recsBanner(data, vals) {
  var v = data.verdict || {}, w = verdictWords(v, null), pr = profRow(data, vals.profile);
  var line = pr ? 'Profile ' + pr.p + ': mean regret ' + fmt(pr.mean_regret, 4) + ', single-best regret ' + fmt(pr.sb_regret, 4) + ', near-optimal ' + fmt(pr.near, 3) + ', gap closed ' + (pr.gap_closed == null ? 'not defined' : fmt(pr.gap_closed, 3)) + ', oracle gap ' + fmt(pr.oracle_gap, 4) + ' (' + esc(pr.verdict) + ').' : '';
  return '<div class="v3-verdict v3-verdict-' + w[0] + '" role="status"><span class="v3-vglyph" aria-hidden="true">' + w[1] + '</span><div><strong>Verdict: ' + esc(w[2]) + '</strong> ' + esc(w[3]) +
    (v.note ? ' <span class="v3-muted">(' + esc(v.note) + ')</span>' : '') + (line ? '<br><span class="v3-muted">' + line + '</span>' : '') + '</div></div>';
}
function recsControls(data) { return [{key: 'profile', label: 'Decision profile', options: data.profiles.map(function (p) { return [p.p, p.p]; })}]; }
function recsSide(data, vals) {
  var pr = profRow(data, vals.profile); if (!pr) return '';
  function box(l, v) { return '<div class="v3-stat"><small>' + l + '</small><strong>' + v + '</strong></div>'; }
  return '<div class="v3-card"><h3>Profile ' + esc(pr.p) + '</h3><div class="v3-stats">' + box('Isolates', pr.n) + box('Folds', pr.folds) + box('Mean regret', fmt(pr.mean_regret, 4)) + box('Single-best regret', fmt(pr.sb_regret, 4)) +
    box('Near-optimal', fmt(pr.near, 3)) + box('Oracle gap', fmt(pr.oracle_gap, 4)) + box('Gap closed', pr.gap_closed == null ? 'n/a' : fmt(pr.gap_closed, 3)) + box('Floor flagged', pr.floor) + '</div></div>';
}
function recsTabs(data, vals, rowsHtml, csv) {
  var tabs = [{name: 'Isolates', html: rowsHtml, csv: csv}];
  tabs.push({name: 'Warnings scored', html: data.warnings.rows.length ? P.tableHTML(data.warnings.header, data.warnings.rows) : '<p class="v3-muted">Not run: no warnings table (needs the recommender evaluation and at least one warning source).</p>',
    csv: data.warnings.rows.length ? {name: 'recommender_warnings.csv', header: data.warnings.header, rows: data.warnings.rows} : null});
  tabs.push({name: 'Leave-taxon-out', html: data.taxon.rows.length ? P.tableHTML(data.taxon.header, data.taxon.rows) : '<p class="v3-muted">Not run: leave-taxon-out needs RUN_RECOMMENDER_EVAL=1 and a genus or phylum per isolate.</p>',
    csv: data.taxon.rows.length ? {name: 'leave_taxon_out.csv', header: data.taxon.header, rows: data.taxon.rows} : null});
  tabs.push({name: 'Profiles', html: P.tableHTML(data.evalHeader, data.evalRows), csv: {name: 'recommender_eval.csv', header: data.evalHeader, rows: data.evalRows}});
  return tabs;
}
var ISO_HEADER = ['sample', 'held_out_study', 'organism', 'recommended_tool', 'recommended_score', 'predicted_score', 'best_tool', 'best_score', 'regret', 'near_optimal', 'single_best_tool', 'single_best_score', 'single_best_regret', 'floor_flag', 'basis'];
function isoCsvRow(r) { return [r[RI.S], r[RI.STUDY], r[RI.ORG], r[RI.RT], r[RI.RS], r[RI.PS], r[RI.BT], r[RI.BS], r[RI.RG], r[RI.NEAR], r[RI.ST], r[RI.SS], r[RI.SR], r[RI.FL], r[RI.BASIS]]; }
function recsPanel(data, vals, grp) {
  var rows = (data.iso && data.iso[vals.profile]) || [], r = rows[+grp.split('|')[1]]; if (!r) return null;
  var tbl = P.tableHTML(['Strategy', 'Tool', 'Predicted', 'Achieved', 'Regret', 'Near-optimal', 'Floor flagged'], [
    ['Per-isolate recommender', r[RI.RT], fmt(r[RI.PS], 4), fmt(r[RI.RS], 4), fmt(r[RI.RG], 4), r[RI.NEAR], r[RI.FL]],
    ['Single best tool', r[RI.ST], '-', fmt(r[RI.SS], 4), fmt(r[RI.SR], 4), '-', '-'],
    ['Oracle best tool', r[RI.BT], '-', fmt(r[RI.BS], 4), '0', '-', '-']]);
  var info = '<p class="v3-muted">' + esc([r[RI.ORG], r[RI.STUDY] ? 'held-out study ' + r[RI.STUDY] : '', r[RI.BASIS] ? 'basis ' + r[RI.BASIS] : ''].filter(Boolean).join(' - ')) + '</p>';
  return {title: 'Isolate ' + r[RI.S] + ' (profile ' + vals.profile + ')', html: info,
    tabs: recsTabs(data, vals, tbl + '<p class="v3-muted">Regret = oracle score minus the strategy\'s score. The CSV holds every isolate of this profile.</p>', {name: 'recommender_regret_' + vals.profile + '.csv', header: ISO_HEADER, rows: rows.map(isoCsvRow)})};
}
function recsPanelDefault(data, vals) {
  var rows = (data.iso && data.iso[vals.profile]) || [];
  return {title: 'Evaluation detail', html: '<p class="v3-muted">Click an isolate to see the tool picked, predicted score, regret and flags.</p>',
    tabs: recsTabs(data, vals, rows.length ? P.tableHTML(ISO_HEADER, rows.map(isoCsvRow)) : '<p class="v3-muted">No per-isolate regret table was written.</p>', rows.length ? {name: 'recommender_regret_' + vals.profile + '.csv', header: ISO_HEADER, rows: rows.map(isoCsvRow)} : null)};
}

/* ================================================================ view 3: stack of rings */
