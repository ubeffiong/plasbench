<script>
/* Synteny view, pure core: zoom and pan of the viewBox. No DOM access. Mirrored in python/report_fig_synteny.py (zoom_at, pan_by) and parity-tested
   under node (test/test_report_fig_synteny.py). Loaded by node (module.exports) and by the browser (window.PBSynteny). */
(function (root) {
'use strict';
var SY = {};
/* viewBox [x, y, w, h] after zooming by factor about (fx, fy); never wider than base, never more than maxZoom times in, kept inside base */
SY.zoomAt = function (view, base, fx, fy, factor, maxZoom) {
  var w = Math.min(base[2], Math.max(base[2] / maxZoom, view[2] / factor)), h = w * base[3] / base[2];
  var x = fx - (fx - view[0]) * (w / view[2]), y = fy - (fy - view[1]) * (h / view[3]);
  x = Math.min(Math.max(x, base[0]), base[0] + base[2] - w); y = Math.min(Math.max(y, base[1]), base[1] + base[3] - h);
  return [x, y, w, h];
};
SY.panBy = function (view, base, dx, dy) {
  return [Math.min(Math.max(view[0] + dx, base[0]), base[0] + base[2] - view[2]), Math.min(Math.max(view[1] + dy, base[1]), base[1] + base[3] - view[3]), view[2], view[3]];
};
if (typeof module !== 'undefined' && module.exports) { module.exports = SY; }
root.PBSynteny = SY;
})(typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this));
</script>
