<style>
/* Presence/absence matrix. The static figure (.fp-static) is the no-JavaScript and print version; the live app replaces it on screen. */
.fp-root{--fp-bg:#fff;--fp-ink:#17231d;--fp-muted:#5a675f;--fp-line:#d9e1da;--fp-panel:#fbfcfb;--fp-accent:#0c6b4f;--fp-focus:#1a5fb4;margin:12px 0;font:13px/1.4 Arial,Helvetica,sans-serif;color:var(--fp-ink);position:relative}
:root[data-theme=dark] .fp-root{--fp-bg:#14181a;--fp-ink:#e6ebe8;--fp-muted:#a3aea8;--fp-line:#33403a;--fp-panel:#1a2022;--fp-accent:#5dc89a;--fp-focus:#7fb2ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .fp-root{--fp-bg:#14181a;--fp-ink:#e6ebe8;--fp-muted:#a3aea8;--fp-line:#33403a;--fp-panel:#1a2022;--fp-accent:#5dc89a;--fp-focus:#7fb2ff}}
.fp-root *{box-sizing:border-box}
.fp-root.fp-live .fp-static{display:none}
.fp-static .rpt-figure{background:#fff;color:#17231d}
.fp-static svg,.fp-svg{display:block;width:100%;height:auto}
.fp-app{border:1px solid var(--fp-line);border-radius:10px;background:var(--fp-bg);overflow:hidden}
.fp-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;padding:10px 14px;border-bottom:1px solid var(--fp-line)}
.fp-field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--fp-muted)}
.fp-field select,.fp-field input[type=number]{font:13px Arial,sans-serif;padding:4px 6px;border:1px solid var(--fp-line);border-radius:6px;background:var(--fp-bg);color:var(--fp-ink);min-height:30px}
.fp-field input[type=number]{width:64px}
.fp-metrics{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.fp-metrics legend{font-size:12px;color:var(--fp-muted);padding:0 0 2px}
.fp-metrics label{display:inline-flex;gap:4px;align-items:center;cursor:pointer;min-height:28px}
.fp-btn{border:1px solid var(--fp-line);background:var(--fp-bg);color:var(--fp-ink);border-radius:6px;padding:5px 10px;cursor:pointer;font:600 12px Arial,sans-serif;min-height:30px}
.fp-btn:hover{background:var(--fp-panel)}
.fp-btn[aria-pressed=true]{background:var(--fp-accent);color:#fff;border-color:var(--fp-accent)}
.fp-root :focus-visible{outline:3px solid var(--fp-focus);outline-offset:2px}
.fp-main{display:grid;grid-template-columns:minmax(0,1fr) 340px}
.fp-main.fp-nopanel{grid-template-columns:minmax(0,1fr)}
.fp-main.fp-nopanel .fp-panel{display:none}
.fp-stage{min-width:0;padding:8px 12px;overflow-x:auto}
.fp-stage .fp-svg{min-width:640px}
.fp-t{fill:var(--fp-ink)}
.fp-dend{stroke:var(--fp-ink)}.fp-axis{stroke:var(--fp-muted)}.fp-sel{stroke:var(--fp-focus)}
.fp-row,.fp-col{cursor:pointer}
.fp-row:hover rect{fill:rgba(26,95,180,.16)}
.fp-col:hover rect{fill:rgba(26,95,180,.16)}
.fp-row:focus,.fp-col:focus{outline:none}
.fp-row:focus-visible rect,.fp-col:focus-visible rect{fill:rgba(26,95,180,.28);stroke:var(--fp-focus);stroke-width:1.2}
.fp-note{margin:6px 0 0;color:var(--fp-muted);font-size:12px}
.fp-panel{border-left:1px solid var(--fp-line);background:var(--fp-panel);min-width:0;padding:10px 14px;max-height:86vh;overflow:auto}
.fp-panel h3{margin:0 0 4px;font-size:14px}
.fp-panel p{margin:4px 0}
.fp-panel table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
.fp-panel th,.fp-panel td{border-bottom:1px solid var(--fp-line);padding:3px 5px;text-align:left}
.fp-panel td.fp-num{text-align:right;font-variant-numeric:tabular-nums}
.fp-chip{display:inline-block;border:1px solid var(--fp-line);border-radius:10px;padding:0 8px;margin:1px 3px 1px 0;font-size:12px}
.fp-flag{display:inline-block;border:1px solid #a35c05;background:#f6ead1;color:#5b3d00;border-radius:10px;padding:0 8px;font-weight:bold;font-size:11.5px}
.fp-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin:6px 0}
.fp-kv dt{color:var(--fp-muted)}.fp-kv dd{margin:0}
.fp-strip{width:100%;height:auto;display:block;margin:4px 0}
.fp-strip .fp-t{font-size:9px}
.fp-tip{position:fixed;z-index:50;pointer-events:none;background:var(--fp-bg);color:var(--fp-ink);border:1px solid var(--fp-line);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:280px}
.fp-sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.fp-link{color:var(--fp-accent)}
.fp-table{margin-top:10px}
@media (max-width:900px){.fp-main{grid-template-columns:minmax(0,1fr)}.fp-panel{border-left:0;border-top:1px solid var(--fp-line);max-height:none}}
@media print{.fp-app,.fp-tip{display:none!important}.fp-root.fp-live .fp-static{display:block}.fp-static .rpt-figure{break-inside:avoid}}
</style>
