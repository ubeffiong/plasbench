<script>
/* PlasBench plasmid viewer, linear alignment pane: reference versus reconstruction. Pure functions (no DOM): lane packing, ribbon paths, strand
   styling, origin-wrap links, overlaps, structural-event markers, the "ordered / oriented correctly?" readout and the SVG scene. Extends
   PlasmidViewerCore, so it is loaded after plasmid_viewer_core.html (by node in test/test_plasmid_viewer.py, by the browser in the report).
   Everything drawn comes from the stored alignment blocks and structural calls; nothing is inferred. The drawing is an illustrative map of
   alignment-derived structure, not a validated assembly comparison. */
(function (root) {
'use strict';
var PV = root.PlasmidViewerCore;
if (!PV) { return; }
var C = PV.cfg, mod = PV.mod, num = PV.num, esc = PV.esc;
var A = PV.align = {};

A.W = 860; A.PADL = 104; A.PADR = 24;
A.ROW_H = 18; A.ROW_STEP = 22; A.OVERLAP_MIN = 20; A.WRAP_QTOL = 250;
A.COL = {fwd: '#E69F00', fwdLine: '#8a5a00', rev: '#0072B2', revLine: '#003f63', gap: '#5a6670', overlap: '#7b1fa2', ref: '#4d5b66'};
A.EVENT_KINDS = {
  inter_replicon_junction: {letter: 'J', name: 'junction between replicons'}, inversion_junction: {letter: 'I', name: 'inversion junction'},
  relocation: {letter: 'R', name: 'relocation'}, reference_deletion: {letter: 'D', name: 'deletion relative to the reference'},
  reference_insertion: {letter: '+', name: 'insertion relative to the reference'}, tandem_duplication: {letter: '2', name: 'tandem duplication'}
};
A.eventKind = function (type) { return A.EVENT_KINDS[type] || {letter: '?', name: String(type || 'event').replace(/_/g, ' ')}; };
A.CAVEAT = 'Alignment-derived and unvalidated: no read or assembly-graph support was checked, and a contig that differs from the reference may be a misassembly, a real rearrangement or a reference error.';

/* strand -> colour, pattern and arrowhead direction (colour AND pattern, so the code survives greyscale and colour-blind viewing) */
A.blockStyle = function (strand) {
  return strand === '-' ? {name: 'reverse', colour: A.COL.rev, line: A.COL.revLine, pattern: 'hatch', arrow: -1, text: 'reverse strand (-)'}
                        : {name: 'forward', colour: A.COL.fwd, line: A.COL.fwdLine, pattern: 'solid', arrow: 1, text: 'forward strand (+)'};
};

function fmtLen(bp) {
  if (bp >= 1000000) { return (bp / 1000000).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + ' Mb'; }
  if (bp >= 1000) { return (bp / 1000).toFixed(bp >= 100000 ? 0 : 1).replace(/\.0$/, '') + ' kb'; }
  return Math.round(bp) + ' bp';
}
A.fmtLen = fmtLen;
function idText(v) { return v === null || v === undefined ? 'n/a' : (v * 100).toFixed(1) + '%'; }

/* ---------- lane packing ---------- */
/* items [{s, e}] -> {rows: row index per item, n: number of rows}; greedy interval colouring, earliest start first, `gap` bp kept between neighbours */
A.packRows = function (items, gap) {
  var order = items.map(function (it, i) { return i; }).sort(function (a, b) { return (items[a].s - items[b].s) || (items[b].e - items[a].e) || (a - b); });
  var ends = [], rows = new Array(items.length), g = gap || 0;
  order.forEach(function (i) {
    var r = 0;
    while (r < ends.length && ends[r] + g > items[i].s) { r++; }
    if (r === ends.length) { ends.push(items[i].e); } else { ends[r] = items[i].e; }
    rows[i] = r;
  });
  return {rows: rows, n: Math.max(1, ends.length)};
};

/* ---------- ribbon path ---------- */
/* a band from the reference ruler (y0, x from ra to rb) to a block edge (y1, x from la to lb); when ra > rb relative to la < lb the band twists (reverse alignment) */
A.ribbonPath = function (ra, rb, y0, la, lb, y1) {
  var ym = (y0 + y1) / 2, n = function (v) { return num(v, 1); };
  return 'M' + n(ra) + ' ' + n(y0) + 'C' + n(ra) + ' ' + n(ym) + ' ' + n(la) + ' ' + n(ym) + ' ' + n(la) + ' ' + n(y1) + 'L' + n(lb) + ' ' + n(y1) +
    'C' + n(lb) + ' ' + n(ym) + ' ' + n(rb) + ' ' + n(ym) + ' ' + n(rb) + ' ' + n(y0) + 'Z';
};
/* a block as an arrow-ended bar (head on the right for forward, on the left for reverse) */
A.blockPath = function (x0, x1, y, h, dir) {
  var w = x1 - x0, hw = Math.min(7, Math.max(0, w / 2)), n = function (v) { return num(v, 1); }, m = y + h / 2;
  if (dir < 0) { return 'M' + n(x1) + ' ' + n(y) + 'L' + n(x0 + hw) + ' ' + n(y) + 'L' + n(x0) + ' ' + n(m) + 'L' + n(x0 + hw) + ' ' + n(y + h) + 'L' + n(x1) + ' ' + n(y + h) + 'Z'; }
  return 'M' + n(x0) + ' ' + n(y) + 'L' + n(x1 - hw) + ' ' + n(y) + 'L' + n(x1) + ' ' + n(m) + 'L' + n(x1 - hw) + ' ' + n(y + h) + 'L' + n(x0) + ' ' + n(y + h) + 'Z';
};

/* ---------- gaps, overlaps, origin wrap ---------- */
A.gaps = function (model, tool) {
  var L = model.length, out = [], pos = 0;
  tool.intervals.forEach(function (iv) {
    var s = Math.max(0, iv[0]), e = Math.min(L, iv[1]);
    if (s > pos) { out.push([pos, s]); }
    pos = Math.max(pos, e);
  });
  if (pos < L) { out.push([pos, L]); }
  return out;
};
/* pairs of blocks of one tool that overlap on the reference by at least OVERLAP_MIN bp (different contigs: contig overlap; same contig: a repeated segment) */
A.overlaps = function (model) {
  if (model._ov) { return model._ov; }
  var out = [];
  model.tools.forEach(function (t) {
    var bl = t.blocks.slice().sort(function (a, b) { return (a.start - b.start) || (a.end - b.end) || (a.i - b.i); }), i, j;
    for (i = 0; i < bl.length; i++) {
      for (j = i + 1; j < bl.length && bl[j].start < bl[i].end; j++) {
        var s = Math.max(bl[i].start, bl[j].start), e = Math.min(bl[i].end, bl[j].end);
        if (e - s >= A.OVERLAP_MIN) { out.push({i: out.length, tool: t.i, a: bl[i].i, b: bl[j].i, start: s, end: e, bp: e - s, same: bl[i].record === bl[j].record}); }
      }
    }
  });
  model._ov = out;
  return out;
};
A.overlapInfo = function (model, ov) {
  var a = model.blocks[ov.a], b = model.blocks[ov.b], t = model.tools[ov.tool];
  return {title: ov.same ? 'Repeated segment within one contig' : 'Overlap between two contigs', rows: [
    ['Tool', t.label], ['Contigs', ov.same ? a.record : a.record + ' and ' + b.record], ['Reference overlap', PV.fmtBp(ov.start) + '-' + PV.fmtBp(ov.end) + ' bp (' + PV.fmtBp(ov.bp) + ' bp)'],
    ['Reading', ov.same ? 'Two parts of one contig align to overlapping reference positions (a duplication-like pattern or a repeat).' : 'Neighbouring contigs cover the same reference stretch (an assembly overlap, or a repeat aligned twice).']]};
};
A.gapInfo = function (model, toolIdx, s, e) {
  var t = model.tools[toolIdx], genes = model.genes.filter(function (g) { return g.start < e && g.end > s && g.start <= g.end; }).length;
  return {title: 'Uncovered truth', rows: [['Tool', t.label], ['Reference interval', PV.fmtBp(s) + '-' + PV.fmtBp(e) + ' bp (' + PV.fmtBp(e - s) + ' bp)'],
    ['Truth features touching it', String(genes)], ['Reading', 'No retained alignment block of this tool covers this stretch of the reference.']]};
};
/* a block touching the end of the reference continues, through the origin, in a block of the same contig that touches position 0 (query coordinates join up) */
A.wrapLinks = function (model, tool) {
  var L = model.length, tol = Math.max(25, Math.round(L * 0.001)), out = [];
  if (model.circular === false) { return out; }
  tool.blocks.forEach(function (a) {
    if (a.end < L - tol) { return; }
    tool.blocks.forEach(function (b) {
      if (b === a || b.record !== a.record || b.strand !== a.strand || b.start > tol) { return; }
      var joined = a.strand === '+' ? Math.abs(a.qEnd - b.qStart) <= A.WRAP_QTOL : Math.abs(a.qStart - b.qEnd) <= A.WRAP_QTOL;
      if (joined) { out.push({from: a.i, to: b.i, record: a.record}); }
    });
  });
  return out;
};

/* ---------- lane layout ---------- */
/* mode 'ref': every block at its reference position, overlapping blocks stacked in rows.

   when order or orientation differs. Each item carries the lane x range (x0, x1) and the reference ends the ribbon attaches to (rx0 pairs with x0). */
A.layoutLane = function (model, tool, mode) {
  var L = model.length, items = [], recs = [], span = L, nRows = 1;
  if (mode === 'contig') {
    var byRec = {}, order = [], off = 0, spacer = Math.max(1, Math.round(L * 0.004));
    tool.blocks.forEach(function (b) {
      var r = byRec[b.record];
      if (!r) { r = byRec[b.record] = {id: b.record, qLen: 0, first: b.start, blocks: []}; order.push(r); }
      r.blocks.push(b); r.first = Math.min(r.first, b.start); r.qLen = Math.max(r.qLen, b.qLen || 0, b.qEnd);
    });
    order.sort(function (p, q) { return (p.first - q.first) || (p.id < q.id ? -1 : (p.id > q.id ? 1 : 0)); });
    order.forEach(function (r) {
      recs.push({id: r.id, x0: off, x1: off + r.qLen, qLen: r.qLen});
      r.blocks.forEach(function (b) {
        var fwd = b.strand === '+';
        items.push({b: b, x0: off + b.qStart, x1: off + b.qEnd, rx0: fwd ? b.start : b.end, rx1: fwd ? b.end : b.start, row: 0});
      });

    var pk = A.packRows(tool.blocks.map(function (b) { return {s: b.start, e: b.end}; }), Math.max(1, Math.round(L * 0.004)));
    tool.blocks.forEach(function (b, k) { items.push({b: b, x0: b.start, x1: b.end, rx0: b.start, rx1: b.end, row: pk.rows[k]}); });
    nRows = pk.n;
  }
  return {mode: mode, items: items, records: recs, span: span, rows: nRows};
};

/* ---------- structural events as flags on the ribbons ---------- */
A.eventMarkers = function (model, tool, lay) {
  var out = [];
  tool.events.forEach(function (ev) {
    var best = null, bestD = Infinity, edge = 'end';
    lay.items.forEach(function (it) {
      if (it.b.record !== ev.record) { return; }
      var de = Math.abs(ev.pos - it.b.end), ds = Math.abs(ev.pos - it.b.start), d = Math.min(de, ds);
      if (d < bestD) { bestD = d; best = it; edge = de <= ds ? 'end' : 'start'; }
    });
    var lx = null;
    if (best) { lx = lay.mode === 'contig' ? ((edge === 'end') === (best.b.strand === '+') ? best.x1 : best.x0) : ev.pos; }
    out.push({ev: ev, item: best, refBp: ev.pos, laneBp: lx, kind: A.eventKind(ev.type)});
  });
  return out;
};

/* ---------- tooltips, details ---------- */
A.blockInfo = function (model, b) {
  var t = model.tools[b.tool], st = A.blockStyle(b.strand), sameRec = t.blocks.filter(function (o) { return o.record === b.record; }).length;
  var rows = [['Tool', t.label], ['Contig', b.record + (b.qLen ? ' (' + PV.fmtBp(b.qLen) + ' bp)' : '')], ['Contig coordinates', PV.fmtBp(b.qStart) + '-' + PV.fmtBp(b.qEnd)],
    ['Reference', PV.fmtBp(b.start) + '-' + PV.fmtBp(b.end) + ' bp (' + PV.fmtBp(b.end - b.start) + ' bp)'], ['Strand', st.text + (b.strand === '-' ? ': the contig runs against the reference' : '')],
    ['Identity', idText(b.identity)]];
  if (b.mapq !== null) { rows.push(['Mapping quality', String(b.mapq)]); }
  if (sameRec > 1) { rows.push(['Blocks of this contig', String(sameRec)]); }
  var ovs = A.overlaps(model).filter(function (o) { return o.a === b.i || o.b === b.i; });
  if (ovs.length) { rows.push(['Overlaps', ovs.map(function (o) { var other = model.blocks[o.a === b.i ? o.b : o.a]; return PV.fmtBp(o.bp) + ' bp with ' + (o.same ? 'another block of the same contig' : other.record); }).join('; ')]); }
  var wl = A.wrapLinks(model, t).filter(function (w) { return w.from === b.i || w.to === b.i; });
  if (wl.length) { rows.push(['Origin', wl[0].from === b.i ? 'continues across the origin (end of the reference to position 0)' : 'continues from the end of the reference across the origin']); }
  var evs = t.events.filter(function (e) { return e.record === b.record; });
  if (evs.length) { rows.push(['Structural events on this contig', evs.map(function (e) { return A.eventKind(e.type).name + ' at ' + PV.fmtBp(e.pos); }).join('; ')]); }
  return {title: b.record + ' (' + t.label + ')', rows: rows};
};
/* detail-tab content for a selected block */
A.relatedBlock = function (model, sel) {
  var b = model.blocks[sel.i], out = {kind: 'b', info: null, siblings: [], genes: [], events: [], overlaps: []};
  if (!b) { return out; }
  var t = model.tools[b.tool];
  out.info = A.blockInfo(model, b);
  out.siblings = t.blocks.filter(function (o) { return o.record === b.record && o.i !== b.i; });
  out.events = t.events.filter(function (e) { return e.record === b.record; });
  out.overlaps = A.overlaps(model).filter(function (o) { return o.a === b.i || o.b === b.i; });
  model.genes.forEach(function (g) {
    var s = Math.max(g.start, b.start), e = Math.min(g.end, b.end), len = g.end - g.start;
    if (g.start <= g.end && e > s) { out.genes.push({gene: g, fraction: len > 0 ? (e - s) / len : 1}); }
  });
  return out;
};

/* ---------- "ordered / oriented correctly?" from the existing calls only ---------- */
A.readout = function (model, tool) {
  var recs = {}, rev = 0, types = {}, nb = tool.blocks.length, gaps = A.gaps(model, tool), gapBp = 0;
  tool.blocks.forEach(function (b) { recs[b.record] = true; if (b.strand === '-') { rev++; } });
  tool.events.forEach(function (e) { var k = A.eventKind(e.type).name; types[k] = (types[k] || 0) + 1; });
  gaps.forEach(function (g) { gapBp += g[1] - g[0]; });
  var names = Object.keys(types).map(function (k) { return types[k] > 1 ? types[k] + ' x ' + k : k; });
  var cf = tool.collinear, oc = tool.orderConflicts, answer, code, text;
  if (!nb) { code = 'none'; answer = 'Not assessable'; text = 'No alignment block of this tool lands on this plasmid.'; }
  else if (tool.events.length) { code = 'discordant'; answer = 'No'; text = tool.events.length + ' structural event' + (tool.events.length === 1 ? '' : 's') + ' called on this plasmid: ' + names.join(', ') + '.'; }
  else if ((cf !== null && cf < 0.999) || (oc !== null && oc > 0)) {
    code = 'partial'; answer = 'Partly';
    text = 'No event was called on this plasmid, but the tool-wide alignment is not fully collinear' + (cf !== null ? ' (collinear fraction ' + (cf * 100).toFixed(1) + '%)' : '') + (oc ? ', ' + oc + ' order conflict' + (oc === 1 ? '' : 's') : '') + '.';
  }
  else if (rev) { code = 'reversed'; answer = 'Yes, reverse-oriented'; text = rev + ' of ' + nb + ' block' + (nb === 1 ? '' : 's') + ' align to the reverse strand (the contig runs against the reference); no inversion, relocation or junction event was called.'; }
  else { code = 'ok'; answer = 'Yes'; text = 'Every block is forward and collinear with the reference, and no structural event was called.'; }
  return {tool: tool, blocks: nb, contigs: Object.keys(recs).length, reverseBlocks: rev, forwardBlocks: nb - rev, events: tool.events.length, eventNames: names, collinear: cf, orderConflicts: oc,
          gaps: gaps.length, gapBp: gapBp, omitted: tool.blocksOmitted, code: code, answer: answer, text: text, caveat: A.CAVEAT};
};

A.shortAnswer = function (rd) { return {none: 'n/a', discordant: 'no', partial: 'partly', reversed: 'yes (reverse)', ok: 'yes'}[rd.code] || 'n/a'; };

/* ---------- keyboard navigation between blocks ---------- */
/* order: [{i, lane, cx}]; dir 'left' | 'right' | 'up' | 'down' */
A.navigate = function (order, cur, dir) {
  if (!order.length) { return null; }
  var at = -1, n;
  for (n = 0; n < order.length; n++) { if (cur && order[n].i === cur.i) { at = n; break; } }
  if (at < 0) { return order[0]; }
  var c = order[at], pool = order.filter(function (o) { return o.i !== c.i; });
  if (dir === 'left' || dir === 'right') {
    var same = order.filter(function (o) { return o.lane === c.lane; }).sort(function (a, b) { return (a.cx - b.cx) || (a.i - b.i); }), k = same.indexOf(c);
    return same[mod(k + (dir === 'right' ? 1 : -1), same.length)];
  }
  var want = c.lane + (dir === 'down' ? 1 : -1), cand = pool.filter(function (o) { return o.lane === want; });
  while (!cand.length && want >= 0 && want < 1000 && pool.some(function (o) { return o.lane === (want += dir === 'down' ? 1 : -1); })) { cand = pool.filter(function (o) { return o.lane === want; }); }
  if (!cand.length) { return c; }
  cand.sort(function (a, b) { return Math.abs(a.cx - c.cx) - Math.abs(b.cx - c.cx); });
  return cand[0];
};

/* ---------- projection of reference positions onto the pane ---------- */
A.makeProj = function (model, state, mode, spanMax) {
  var L = model.length, v = PV.makeView(L, state.view.start, state.view.span || L), X0 = A.PADL, PW = A.W - A.PADL - A.PADR;
  var p = {mode: mode, L: L, X0: X0, PW: PW, zoomed: false, vstart: 0, vspan: L};
  if (mode === 'contig') { p.vspan = Math.max(1, spanMax); }
  else if (!v.full) { p.zoomed = true; p.vstart = v.start; p.vspan = v.span; }
  /* shifts d so that bp + d lies in the window (two candidates for a window that wraps the origin) */
  p.copies = function (s, e) {
    if (mode === 'contig') { return [0]; }
    var r0 = mod(s - p.vstart, L), out = [], i, c = [r0 - s, r0 - s - L];
    for (i = 0; i < c.length; i++) { if (e + c[i] > 0 && s + c[i] < p.vspan) { out.push(c[i]); } }
    return out;
  };
  p.x = function (bp, d) { return X0 + (bp + (d || 0)) / p.vspan * PW; };
  p.bpAt = function (x) { var rel = (x - X0) / PW * p.vspan; return mode === 'contig' ? rel : mod(p.vstart + rel, L); };
  return p;
};

/* ---------- the scene ---------- */
function tx(x, y, text, size, anchor, weight, fill, extra) {
  return "<text x='" + num(x, 1) + "' y='" + num(y, 1) + "' font-size='" + num(size, 1) + "' text-anchor='" + anchor + "' font-weight='" + weight + "' fill='" + fill +
    "' font-family='Arial,Helvetica,sans-serif' " + (extra || '') + '>' + esc(text) + '</text>';
}
function halo(x, y, text, size, anchor, weight, fill, haloColour, extra) {
  return tx(x, y, text, size, anchor, weight, fill, "stroke='" + haloColour + "' stroke-width='2.4' stroke-linejoin='round' paint-order='stroke' " + (extra || ''));

function geneArrow(x0, x1, y, h, strand) {
  var w = x1 - x0, hw = Math.min(5, Math.max(0, w / 2)), n = function (v) { return num(v, 1); }, m = y + h / 2;
  if (strand === '-') { return 'M' + n(x1) + ' ' + n(y) + 'L' + n(x0 + hw) + ' ' + n(y) + 'L' + n(x0) + ' ' + n(m) + 'L' + n(x0 + hw) + ' ' + n(y + h) + 'L' + n(x1) + ' ' + n(y + h) + 'Z'; }
  if (strand === '+') { return 'M' + n(x0) + ' ' + n(y) + 'L' + n(x1 - hw) + ' ' + n(y) + 'L' + n(x1) + ' ' + n(m) + 'L' + n(x1 - hw) + ' ' + n(y + h) + 'L' + n(x0) + ' ' + n(y + h) + 'Z'; }

}
function minW(x0, x1, m) { if (x1 - x0 >= m) { return [x0, x1]; } var c = (x0 + x1) / 2; return [c - m / 2, c + m / 2]; }

A.scene = function (model, state, opts) {

  var tools = PV.visibleTools(model, state), W = A.W, ov = A.overlaps(model), sel = state.sel || null, cur = opts.cur || null;
  var lanes = tools.map(function (t) { return {tool: t, lay: A.layoutLane(model, t, mode)}; }), spanMax = L;
  lanes.forEach(function (l) { spanMax = Math.max(spanMax, l.lay.span); });
  var P = A.makeProj(model, state, mode, spanMax), X0 = P.X0, XR = P.X0 + P.PW;
  var defs = [], back = [], top = [], body = [], edge = [], over = [], order = [], shapes = {}, ribs = {}, markers = {}, laneBox = {}, geneShapes = {};
  var counts = {blocks: 0, ribbons: 0, events: 0, overlaps: 0, gaps: 0, genes: 0, wraps: 0};
  defs.push("<pattern id='pvl-rev' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='6' height='6' fill='" + A.COL.rev + "'/><line x1='0' y1='0' x2='0' y2='6' stroke='#d6eaf7' stroke-width='2.2'/></pattern>");
  defs.push("<pattern id='pvl-revr' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='6' height='6' fill='" + A.COL.rev + "' fill-opacity='0.3'/><line x1='0' y1='0' x2='0' y2='6' stroke='" + A.COL.rev + "' stroke-width='1.6' stroke-opacity='0.75'/></pattern>");
  defs.push("<pattern id='pvl-ov' width='5' height='5' patternUnits='userSpaceOnUse' patternTransform='rotate(-45)'><rect width='5' height='5' fill='#ffffff' fill-opacity='0.55'/><line x1='0' y1='0' x2='0' y2='5' stroke='" + A.COL.overlap + "' stroke-width='1.8'/></pattern>");
  defs.push("<clipPath id='pvl-clip'><rect x='" + num(X0) + "' y='-6' width='" + num(P.PW) + "' height='20000'/></clipPath>");

  /* ---- top: scale, truth bar, truth annotations ---- */
  var y = 0, step, first, pos, tickBoxes = [];
  step = PV.niceTicks(P.vspan, 10).step;
  first = Math.ceil((mode === 'contig' ? 0 : P.vstart) / step) * step;
