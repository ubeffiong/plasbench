<script>
(()=>{
function setup(){
const nav=document.querySelector('nav.nav');if(!nav)return;
const groups=[...nav.querySelectorAll('details[data-navgroup]')];if(!groups.length)return;
// One group open at a time; a click on a link, Escape or a click elsewhere closes it.
groups.forEach(d=>d.addEventListener('toggle',()=>{if(d.open)groups.forEach(o=>{if(o!==d)o.open=false})}));
nav.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('a'))groups.forEach(d=>{d.open=false})});
document.addEventListener('click',e=>{if(!nav.contains(e.target))groups.forEach(d=>{d.open=false})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')groups.forEach(d=>{d.open=false})});
// Mark the group that holds the current section (the section tracker sets aria-current on the link).
function mark(){groups.forEach(d=>{if(d.querySelector("a[aria-current='true']"))d.setAttribute('data-current','');
 else d.removeAttribute('data-current')})}
new MutationObserver(mark).observe(nav,{subtree:true,attributes:true,attributeFilter:['aria-current']});mark()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();
</script>
