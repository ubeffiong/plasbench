<style id="rpt-layout-style">
/* Page shell (python/report_layout.py): fixed top bar, left rail of views, compact title band, one view at a time.
   One visual system: a 4 px spacing scale, one card (white, 1 px --line border, 10 px radius), one table style, one heading scale. */
:root{--top-h:52px;--rail-w:220px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r:10px;
 --ink-2:#3d4a42;--focus:#0072B2;--chip-ok-bg:#dcefdc;--chip-ok-fg:#07573e;--chip-warn-bg:#f6ead1;--chip-warn-fg:#6b4600;--chip-mute-bg:#eceeed;--chip-mute-fg:#3f4a44}
html.pb-rail-min{--rail-w:56px}
html{scroll-padding-top:calc(var(--top-h) + 16px)}
body{padding-top:var(--top-h)}
.rpt-sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.rpt-topbar :focus-visible,.rpt-rail :focus-visible,.rpt-view :focus-visible,.rpt-nojs-links :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ---- top bar ---- */
.rpt-topbar{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--top-h);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);background:#183a2d;color:#fff;font:13px/1.3 Arial,Helvetica,sans-serif;box-shadow:0 1px 4px rgba(10,25,18,.35)}
.rpt-brand{color:#fff;font:700 16px Arial,sans-serif;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.rpt-brand b{color:#a8d29b}
.rpt-top-run{color:#cfe3d6;max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt-top-view{color:#fff;font-weight:700;padding-left:var(--s3);border-left:1px solid #ffffff55;white-space:nowrap}
.rpt-top-gap{flex:1 1 0}
.rpt-search{position:relative;flex:0 1 280px}
.rpt-search input{width:100%;height:32px;padding:0 var(--s3);border:1px solid #ffffff66;border-radius:16px;background:#ffffff22;color:#fff;font:13px Arial,sans-serif}
.rpt-search input::placeholder{color:#d9e7de}
.rpt-search input:focus{background:#fff;color:var(--ink);outline:2px solid #a8d29b;outline-offset:1px}
.rpt-search input:focus::placeholder{color:#59665e}
.rpt-results{position:absolute;left:0;right:0;top:38px;margin:0;padding:var(--s1);list-style:none;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(21,36,28,.25);max-height:60vh;overflow:auto;min-width:320px}
.rpt-results[hidden]{display:none}
.rpt-results a{display:flex;justify-content:space-between;gap:var(--s3);padding:7px var(--s3);border-radius:6px;color:var(--ink);text-decoration:none;font:13px Arial,sans-serif}
.rpt-results a small{color:var(--muted);white-space:nowrap}
.rpt-results a:hover,.rpt-results a[aria-selected='true']{background:var(--lime)}
.rpt-results .rpt-none{padding:7px var(--s3);color:var(--muted)}
.rpt-actions{display:flex;gap:var(--s2);align-items:center}
.rpt-actions button{height:32px;padding:0 var(--s3);border:1px solid #ffffff77;border-radius:6px;background:transparent;color:#fff;font:600 12px Arial,sans-serif;cursor:pointer;white-space:nowrap}
.rpt-actions button:hover{background:#ffffff26}
.rpt-actions button[aria-pressed='true']{background:#fff;color:#183a2d;border-color:#fff}
.rpt-actions button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---- left rail ---- */
.rpt-rail{background:#fff;border-right:1px solid var(--line);font:13px Arial,sans-serif}
.rpt-rail ul{list-style:none;margin:0;padding:0}
.rpt-rail-toggle{display:none}
.rpt-rail a{color:var(--ink-2);text-decoration:none}
.rpt-rail-link{display:flex;align-items:center;gap:var(--s3);min-height:40px;padding:6px var(--s4);border-left:3px solid transparent;font-weight:700}
.rpt-rail-link:hover{background:#eef4ef;color:var(--ink)}
.rpt-rail-link[aria-current='page']{background:var(--lime);border-left-color:var(--green);color:#063d2c}
.rpt-ico{flex:0 0 20px;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rpt-rail-label{flex:1 1 auto}
.rpt-rail-count{font:600 11px Arial,sans-serif;color:var(--ink-2);background:#e6ece7;border-radius:10px;padding:1px 7px}
.rpt-rail-sub{padding:0 0 var(--s2) 0}
.rpt-rail-sub a{display:block;padding:4px var(--s4) 4px 52px;font-size:12px;line-height:1.35}
.rpt-rail-sub a:hover{background:#eef4ef;color:var(--ink)}
.rpt-rail-sub a[aria-current='true']{color:var(--green);font-weight:700}
.rpt-rail-foot{display:none}
html.pb-js .rpt-rail{position:fixed;z-index:50;top:var(--top-h);left:0;bottom:0;width:var(--rail-w);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;transition:width .15s}
html.pb-js .rpt-rail-sub{display:none}
html.pb-js .rpt-rail-toggle{display:flex;align-items:center;gap:var(--s3);margin:0;padding:10px var(--s4);border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--ink-2);font:600 12px Arial,sans-serif;cursor:pointer;text-align:left;width:100%}
html.pb-js .rpt-rail-toggle:hover{background:#eef4ef}
html.pb-js .rpt-rail-toggle .rpt-ico{transition:transform .15s}
html.pb-rail-min .rpt-rail-toggle .rpt-ico{transform:rotate(180deg)}
html.pb-rail-min .rpt-rail-label,html.pb-rail-min .rpt-rail-count,html.pb-rail-min .rpt-rail-sub,html.pb-rail-min .rpt-rail-toggle span{display:none!important}
html.pb-rail-min .rpt-rail-link,html.pb-rail-min .rpt-rail-toggle{justify-content:center;padding-left:0;padding-right:0}
html:not(.pb-js) .rpt-rail{padding:var(--s3) var(--s5);border-bottom:1px solid var(--line)}
html:not(.pb-js) .rpt-rail-list{columns:3 260px}
html:not(.pb-js) .rpt-rail-item{break-inside:avoid}
html:not(.pb-js) .rpt-rail-link{padding-left:0}
html:not(.pb-js) .rpt-rail-sub a{padding-left:28px}
html:not(.pb-js) [data-needs-js]{display:none!important}

/* ---- shell, title band, views ---- */
html.pb-js .rpt-shell{margin-left:var(--rail-w);transition:margin-left .15s}
.rpt-shell main{max-width:1440px;margin:0 auto;padding:var(--s4) var(--s5) var(--s6)}
.rpt-shell footer{margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--line);color:var(--muted);font:12px Arial,sans-serif}
.rpt-titleband{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3) var(--s5);padding:var(--s4) var(--s5);background:#fff;border-bottom:1px solid var(--line)}
.rpt-title-text{flex:1 1 420px;min-width:0}
.rpt-eyebrow{margin:0 0 2px;color:var(--muted);font:700 11px/1.3 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.rpt-titleband h1{margin:0;font:700 clamp(17px,1.9vw,22px)/1.25 Arial,sans-serif;letter-spacing:-.01em;color:var(--ink)}
.rpt-runline{margin:4px 0 0;color:var(--ink-2);font:13px/1.4 Arial,sans-serif}
.rpt-kpis .metrics{display:flex;flex-wrap:wrap;gap:var(--s2);margin:0}
.rpt-kpis .metric{box-shadow:none;border:1px solid var(--line);border-top:3px solid var(--green);border-radius:8px;padding:6px var(--s3);min-width:104px;max-width:240px}
.rpt-kpis .metric small{font-size:10px;line-height:1.25}
.rpt-kpis .metric strong{font-size:19px;margin-top:2px}
.rpt-cover{display:none}
html.pb-js:not(.pb-printmode) .rpt-view{display:none}
html.pb-js .rpt-view.rpt-active,html.pb-printmode .rpt-view{display:grid}
.rpt-view{grid-template-columns:minmax(0,1fr);column-gap:var(--s5);align-items:start;margin-top:var(--s4);scroll-margin-top:calc(var(--top-h) + 8px)}
.rpt-view-head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s4);margin:0 0 var(--s3);padding-bottom:var(--s2);border-bottom:2px solid var(--green)}
.rpt-view-title{margin:0;font:700 22px/1.2 Arial,sans-serif;color:var(--ink)}
.rpt-view-blurb{margin:0;flex:1 1 320px;color:var(--ink-2);font:13px/1.45 Arial,sans-serif}
.rpt-view-count{color:var(--muted);font:12px Arial,sans-serif}
.rpt-body{grid-column:1;min-width:0}
/* "On this page": the sections of the view on show, at the bottom of the left rail (JS builds it; the rail's own sub-list serves the no-JS page) */
.rpt-rail-toc{display:none}
html.pb-js .rpt-rail-toc{display:block;margin-top:auto;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:var(--s3) 0 var(--s2);max-height:44%;overflow:auto;font:12px/1.35 Arial,sans-serif}
.rpt-rail-toc p{margin:0 0 var(--s2);padding:0 var(--s4);color:var(--muted);font:700 10px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.rpt-rail-toc a{display:block;padding:4px var(--s4);color:var(--ink-2);text-decoration:none;border-left:3px solid transparent}
.rpt-rail-toc a:hover{background:#eef4ef;color:var(--ink)}
.rpt-rail-toc a[aria-current='true']{color:var(--green);font-weight:700;border-left-color:var(--green)}
html.pb-rail-min .rpt-rail-toc{display:none}
.rpt-nojs-links{display:none}
/* sections as cards: one coherent block style */
.rpt-body>section,.rpt-card-body>section{margin:0 0 var(--s4);padding:var(--s4) var(--s5);background:#fff;border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:calc(var(--top-h) + 12px)}
.rpt-body>section:last-child{margin-bottom:0}
.rpt-body h2{font:700 18px/1.3 Arial,sans-serif;margin:0 0 var(--s2)}
.rpt-body h3{font:700 15px/1.3 Arial,sans-serif;margin:var(--s4) 0 var(--s2)}
.rpt-body .lead{margin:0 0 var(--s3);color:var(--ink-2)}
.rpt-body .panel{border-radius:8px;margin:var(--s2) 0}
.rpt-body th{background:#edf2ec;color:var(--ink);font-size:11px}
.rpt-body table{min-width:0}
.rpt-body td,.rpt-body th{padding:7px 10px}
/* accordion cards */
.rpt-card{margin:0 0 var(--s2);background:#fff;border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:calc(var(--top-h) + 12px)}
.rpt-card>summary{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s4);cursor:pointer;list-style:none;font:700 14px/1.3 Arial,sans-serif;color:var(--ink);border-radius:var(--r)}
.rpt-card>summary::-webkit-details-marker{display:none}
.rpt-card>summary::before{content:'';flex:0 0 8px;width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .12s}
.rpt-card[open]>summary::before{transform:rotate(45deg)}
.rpt-card>summary:hover{background:#f1f6f1}
.rpt-card[open]>summary{border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.rpt-card-title{flex:1 1 auto;min-width:0}
.rpt-chips2{display:flex;flex-wrap:wrap;gap:var(--s1);justify-content:flex-end}
.rpt-chip{display:inline-block;padding:2px 9px;border-radius:11px;font:700 11px/1.5 Arial,sans-serif;white-space:nowrap;border:1px solid transparent}
.rpt-chip-neutral{background:#e6eef6;color:#17457e;border-color:#c5d6e8}
.rpt-chip-ok{background:var(--chip-ok-bg);color:var(--chip-ok-fg);border-color:#b7d6bd}
.rpt-chip-warn{background:var(--chip-warn-bg);color:var(--chip-warn-fg);border-color:#e3cd9b}
.rpt-chip-muted{background:var(--chip-mute-bg);color:var(--chip-mute-fg);border-color:#d3d8d5}
.rpt-card-body{padding:var(--s3) var(--s4) var(--s4)}
.rpt-card-body>section{margin:0;padding:0;border:0;border-radius:0;background:none}
.rpt-card-body>section>h2{font:600 13px Arial,sans-serif;color:var(--muted);margin:0 0 var(--s2)}
.rpt-card-body>section:target{outline:2px solid var(--focus)}

/* narrow screens: the rail becomes a horizontal tab bar under the top bar */
@media (max-width:1180px){
 .rpt-view{grid-template-columns:minmax(0,1fr)}
 html.pb-js .rpt-rail-toc{display:none}
}
@media (max-width:820px){
 .rpt-top-run,.rpt-top-view{display:none}
 .rpt-topbar{gap:var(--s2);padding:0 var(--s3)}
 .rpt-actions button{padding:0 var(--s2)}
 .rpt-actions .rpt-btn-long{display:none}
 html.pb-js body{padding-top:calc(var(--top-h) + 44px)}
 html.pb-js .rpt-rail{top:var(--top-h);bottom:auto;left:0;right:0;width:auto;height:44px;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
 html.pb-js .rpt-rail-toggle{display:none}
 html.pb-js .rpt-rail-list{display:flex}
 html.pb-js .rpt-rail-item{flex:0 0 auto}
 html.pb-js .rpt-rail-sub,html.pb-js .rpt-rail-item.rpt-active>.rpt-rail-sub{display:none}
 html.pb-js .rpt-rail-link{min-height:44px;padding:0 var(--s3);border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
 html.pb-js .rpt-rail-link[aria-current='page']{border-bottom-color:var(--green)}
 html.pb-js .rpt-rail-count{display:none}
 html.pb-rail-min .rpt-rail-label{display:inline!important}
 html.pb-js .rpt-shell{margin-left:0}
 .rpt-shell main{padding:var(--s3)}
 .rpt-titleband{padding:var(--s3)}
 .rpt-body>section{padding:var(--s3)}
 .rpt-search{flex:1 1 120px}
 html{scroll-padding-top:calc(var(--top-h) + 56px)}
 .rpt-view{scroll-margin-top:calc(var(--top-h) + 52px)}
 .rpt-body>section,.rpt-card,.rpt-card-body>section{scroll-margin-top:calc(var(--top-h) + 56px)}
}
@media (prefers-reduced-motion:reduce){.rpt-rail,.rpt-shell,.rpt-card>summary::before,.rpt-rail-toggle .rpt-ico{transition:none}}
</style>
