<style>
/* Tool fingerprint (python/report_fig_fingerprint.py). Same look as the ladder, precision-recall and plasmid-map panels: figure left, collapsible
   side panel right, tooltip box, 3px focus ring. The server-drawn tiles are the no-JavaScript and print version; the script adds behaviour only.
   Colours use the report tokens (--ink, --muted, --line, --card, --green); the dark block applies only when the page sets data-theme="dark". */
.fpr-root{margin:12px 0;font:13px/1.45 Arial,Helvetica,sans-serif;color:var(--ink,#17231d);--fpr-bg:var(--card,#fff);--fpr-soft:#fbfcfb;--fpr-chip:#fff;--fpr-sel:#e6f0ff;--fpr-ring:#1a5fb4}
.fpr-root *{box-sizing:border-box}
.fpr-key{display:flex;flex-wrap:wrap;gap:2px 14px;list-style:none;margin:0 0 4px;padding:0;font-size:12px}
.fpr-key b{display:inline-block;min-width:2.6em;font-family:Consolas,Menlo,monospace}
.fpr-scale{margin:0 0 8px;font-size:12px;color:var(--muted,#627067)}
.fpr-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.fpr-bar .fpr-sp{flex:1}
.fpr-btn{border:1px solid #b9c5bd;background:var(--fpr-chip);color:var(--ink,#17231d);border-radius:6px;padding:5px 10px;cursor:pointer;font:600 12px Arial,sans-serif;line-height:1.2}
.fpr-btn:hover{background:#eef4ef}
.fpr-btn[aria-pressed=true],.fpr-btn[aria-expanded=true].fpr-primary{background:var(--green,#0c6b4f);color:#fff;border-color:var(--green,#0c6b4f)}
.fpr-root :focus-visible{outline:3px solid var(--fpr-ring);outline-offset:2px}
.fpr-main{display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--line,#d9e1da);background:var(--fpr-bg);border-radius:10px;overflow:hidden}
.fpr-on .fpr-main.fpr-open{grid-template-columns:minmax(0,1fr) 340px}
.fpr-stage{min-width:0;padding:8px 12px 10px;position:relative}
.fpr-track h3{margin:6px 0 4px;font:700 14px Arial,sans-serif}
.fpr-track h3 small{font-weight:400;color:var(--muted,#627067)}
.fpr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--fpr-tile,132px),1fr));gap:8px}
.fpr-sizes{display:inline-flex;gap:2px}.fpr-sizes .fpr-btn{padding:3px 9px}
.fpr-tile{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line,#d9e1da);border-radius:8px;padding:4px 4px 6px;background:var(--fpr-bg);text-align:center;min-width:0;overflow:hidden}
.fpr-svg{display:block;width:100%;max-width:100%;height:auto;overflow:hidden}
.fpr-name{display:flex;align-items:center;gap:5px;font-weight:700;font-size:12px;max-width:100%}
.fpr-name i{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.fpr-sub{font-size:11px;color:var(--muted,#627067)}
.fpr-on .fpr-tile{cursor:pointer}
.fpr-on .fpr-tile:hover{border-color:#7aa6e0}
.fpr-tile[aria-pressed=true]{background:var(--fpr-sel);border-color:var(--fpr-ring);box-shadow:0 0 0 1px var(--fpr-ring) inset}
.fpr-tile.fpr-cmp{border-style:dashed;border-color:var(--fpr-ring)}
.fpr-track details{margin:6px 0 4px}
.fpr-track details table{width:100%;font-size:12px}
.fpr-panel{border-left:1px solid var(--line,#d9e1da);background:var(--fpr-soft);min-width:0;max-height:560px;overflow:auto;padding:10px 12px 14px}
.fpr-panel[hidden]{display:none}
.fpr-panel h3{margin:0 0 2px;font:700 15px Arial,sans-serif}
.fpr-panel h4{margin:12px 0 6px;font:700 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#627067)}
.fpr-panel table{width:100%;border-collapse:collapse;min-width:0}
.fpr-panel th,.fpr-panel td{white-space:normal;padding:3px 5px;text-align:left;vertical-align:top;border-top:1px solid var(--line,#d9e1da);font-size:12px}
.fpr-panel th{background:#edf2ec;font-size:11px}
.fpr-panel a{color:#0a5a41}
.fpr-panel .fpr-close{float:right}
.fpr-panel .fpr-def{color:var(--muted,#627067);font-size:11.5px;display:block}
.fpr-panel .fpr-na{color:var(--muted,#627067)}
.fpr-panel .fpr-big{width:100%;max-width:230px;height:auto;display:block;margin:4px auto}
.fpr-lg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin:4px 0}
.fpr-lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.fpr-tip{position:absolute;z-index:5;max-width:270px;background:#14211b;color:#fff;border-radius:8px;padding:7px 10px;font:12px/1.35 Arial,sans-serif;pointer-events:none;box-shadow:0 4px 14px #0005}
.fpr-tip[hidden]{display:none}
.fpr-tip strong{display:block;font-size:13px;margin-bottom:3px}
.fpr-tip dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:0}
.fpr-tip dt{color:#b8cbc0}.fpr-tip dd{margin:0}
.fpr-hit{background:#fff3b0;transition:background 1s}
:root[data-theme="dark"] .fpr-root{--fpr-bg:#17211c;--fpr-soft:#1d2923;--fpr-chip:#22302a;--fpr-sel:#1f3a5c;--fpr-ring:#7aa6e0}
:root[data-theme="dark"] .fpr-panel th{background:#26332c}
:root[data-theme="dark"] .fpr-btn:hover{background:#2d3d35}
:root[data-theme="dark"] .fpr-panel a{color:#8fd1b5}
@media (max-width:900px){.fpr-on .fpr-main.fpr-open{grid-template-columns:minmax(0,1fr)}.fpr-panel{border-left:0;border-top:1px solid var(--line,#d9e1da);max-height:none}}
@media (max-width:520px){.fpr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.fpr-stage{padding:6px}}
@media print{.fpr-bar,.fpr-tip,.fpr-panel{display:none!important}.fpr-main{display:block;border:0}.fpr-tile{break-inside:avoid}.fpr-grid{grid-template-columns:repeat(4,1fr)}}
</style>
