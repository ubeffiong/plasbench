    b.appendChild(el('h4', null, 'Structural events on this contig'));
    b.appendChild(detailLinks(rel.events, function (ev) { return el('li', null, [linkBtn(ev.type, function () { doSelect('e', ev.i); }), el('span', {'class': 'pv-muted'}, ' at ' + ev.pos.toLocaleString('en-US') + ' bp')]); }));
    b.appendChild(el('h4', null, 'Overlaps with other blocks'));
    b.appendChild(detailLinks(rel.overlaps, function (o) { var other = M.blocks[o.a === bk.i ? o.b : o.a]; return el('li', null, [linkBtn(other.record + ' ' + PV.fmtBp(other.start) + '-' + PV.fmtBp(other.end), function () { doSelect('b', other.i); }), el('span', {'class': 'pv-muted'}, ', ' + PV.fmtBp(o.bp) + ' bp' + (o.same ? ', same contig' : ''))]); }));
    b.appendChild(el('h4', null, 'Truth features inside the aligned interval'));
    b.appendChild(detailLinks(rel.genes.slice(0, 20), function (x) { return geneLink(x.gene, ', ' + Math.round(x.fraction * 100) + '% inside'); }));
  }
}
function tabAppearance(b) {
  b.appendChild(el('h4', null, 'Palette'));
  b.appendChild(check('Colour-blind safe palette (follows the report toggle)', function () { return S.cvd; }, function (v) { S.cvd = v; legendBuilt = ''; renderPanelIf('appearance'); draw(); }));
  var sw = el('div', {'class': 'pv-row'});

}
function fileBase() { return ('plasbench-' + M.sample + '-' + M.plasmid).replace(/[^A-Za-z0-9._-]+/g, '_'); }
function download(name, data, mime) {

  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
}
function exportAlign() {

}
function exportSvg() { download(fileBase() + '.svg', PV.standaloneSvg(M, S, {maxScale: 1.5}), 'image/svg+xml'); announce('SVG downloaded'); }

      var ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(function (blob) { if (blob) { download(fileBase() + '.png', blob, 'image/png'); announce('PNG downloaded'); } else { announce('PNG export failed'); } }, 'image/png');
    } catch (e) { announce('PNG export failed'); }

function tabExport(b) {
  b.appendChild(el('h4', null, 'Figure'));
  b.appendChild(el('div', {'class': 'pv-row'}, [btn('Download SVG', exportSvg), btn('Download PNG', exportPng), btn('Linear alignment SVG', exportAlign), btn('Print this map', function () { window.print(); })]));
  b.appendChild(el('p', {'class': 'pv-note'}, 'The figure is exactly what is on screen: current zoom, rotation, layers, filters, palette and selection.'));
  b.appendChild(el('h4', null, 'Tables (TSV)'));
  b.appendChild(el('div', {'class': 'pv-row'}, [
    btn('Features TSV', function () { var ids = lastFeatIds && S.tab === 'export' && featQuery ? lastFeatIds : null; download(fileBase() + '.features.tsv', PV.tsv(PV.FEATURE_COLS, PV.featureRows(M, ids)), 'text/tab-separated-values'); announce('Features TSV downloaded'); }),
    btn('Tools TSV', function () { download(fileBase() + '.tools.tsv', PV.tsv(PV.TOOL_COLS, PV.toolRows(M)), 'text/tab-separated-values'); announce('Tools TSV downloaded'); }),
    btn('Events TSV', function () { download(fileBase() + '.events.tsv', PV.tsv(PV.EVENT_COLS, PV.eventRows(M)), 'text/tab-separated-values'); announce('Events TSV downloaded'); })]));
  b.appendChild(el('p', {'class': 'pv-note'}, featQuery ? 'The features table honours the text typed in the Features filter (' + (lastFeatIds ? lastFeatIds.length : M.genes.length) + ' rows).' : 'The features table has every truth feature of this plasmid; type in the Features filter first to export a subset.'));
  b.appendChild(el('h4', null, 'Share'));
  b.appendChild(el('div', {'class': 'pv-row'}, [btn('Copy link to this view', function () {
    writeHash(); var url = location.href;
    try { navigator.clipboard.writeText(url).then(function () { announce('Link copied'); }, function () { announce('Copy failed; the address bar holds the link'); }); } catch (e) { announce('Copy failed; the address bar holds the link'); }
  })]));
  b.appendChild(el('p', {'class': 'pv-note'}, 'The address bar keeps the sample, plasmid, selection, zoom, layers and filters, so the link reopens this exact view.'));
}

/* ---------- URL hash and loading ---------- */
function writeHash() { try { var h = PV.encodeHash(S, M); if (location.hash !== h) { history.replaceState(null, '', h); } } catch (e) { /* file: pages may refuse */ } }
function scheduleHash() { if (hashTimer) { clearTimeout(hashTimer); } hashTimer = setTimeout(writeHash, 250); }
function findModel(sample, plasmid) {
  var hit = null;
  models.forEach(function (m) { if (!hit && m.sample === sample && m.plasmid === plasmid) { hit = m; } });
  if (!hit) { models.forEach(function (m) { if (!hit && m.sample === sample) { hit = m; } }); }
  return hit;
}
function sanitize(st, m) {
  var names = {}; m.tools.forEach(function (t) { names[t.name] = true; });
  if (st.toolsOn) { st.toolsOn = st.toolsOn.filter(function (n) { return names[n]; }); }
  if (st.sel) { var pool = {g: m.genes, t: m.tools, e: m.events, b: m.blocks}[st.sel.k]; if (!pool || !pool[st.sel.i]) { st.sel = null; } }
  if (st.hl !== null && st.hl !== undefined && !m.tools[st.hl]) { st.hl = null; }
  return st;
}
function loadModel(model, st, quiet) {
  M = model; S = sanitize(st || PV.defaultState(), model); S.sample = model.sample; S.plasmid = model.plasmid;
  cur = null; curB = null; kbdL = false; hotArc = null; hits = []; kbd = false; legendBuilt = ''; featQuery = ''; lastFeatIds = null; pendingZoom = 1; sortState = {}; hideTip();
  selSample.value = model.sample;
  selPlasmid.textContent = '';
  models.filter(function (m) { return m.sample === model.sample; }).forEach(function (m) { selPlasmid.appendChild(el('option', {value: m.plasmid, selected: m.plasmid === model.plasmid}, m.plasmid + ' (' + m.length.toLocaleString('en-US') + ' bp)')); });
  var nOk = model.tools.filter(function (t) { return (t.completeness || 0) >= C.COVERAGE_GOOD; }).length;
  sumEl.textContent = model.length.toLocaleString('en-US') + ' bp, circular ' + (model.circular === null ? 'unknown' : (model.circular ? 'yes' : 'no')) + ', ' + model.genes.length + ' annotations, ' +
    model.tools.length + ' tools (' + nOk + ' at or above ' + Math.round(C.COVERAGE_GOOD * 100) + '% complete), ' + model.events.length + ' structural events';
  Array.prototype.forEach.call(strip.querySelectorAll('.pv-thumb'), function (b) { b.setAttribute('aria-current', String(b.getAttribute('data-id') === model.id)); });
  renderTabs(); draw(); renderPanel(); panelBtn.setAttribute('aria-expanded', String(!main.classList.contains('pv-nopanel')));
  if (!quiet) { announce('Showing ' + model.plasmid + ' from ' + model.sample); }
}
function freshState() {
  var st = PV.defaultState();
  if (S) { st.cvd = S.cvd; st.labelSize = S.labelSize; st.legend = S.legend; st.alMode = S.alMode; st.alRibbons = S.alRibbons; st.alGenes = S.alGenes; st.tab = S.tab === 'detail' ? 'layers' : S.tab; } else { st.labelSize = prefs.labelSize || 1; st.legend = prefs.legend !== false; st.tab = PV.TABS.indexOf(prefs.tab) >= 0 && prefs.tab !== 'detail' ? prefs.tab : 'layers'; }
  return st;
}
function stepPlasmid(d) {
  var i = models.indexOf(M), nxt = models[(i + d + models.length) % models.length]; loadModel(nxt, freshState());
}
function applyHash(first) {
  var parsed = PV.decodeHash(location.hash);
  if (!parsed) { return false; }
  var model = findModel(parsed.sample || (M && M.sample) || models[0].sample, parsed.plasmid || (M && M.plasmid) || '') || models[0];
  var st = PV.stateFromHash(parsed, model), base = freshState();
  ['cvd', 'labelSize', 'legend', 'tab'].forEach(function (k) { if (!(k in parsed)) { st[k] = base[k]; } });
  loadModel(model, st, first);
  return !!parsed.sample;
}
var samples = [];
models.forEach(function (m) { if (samples.indexOf(m.sample) < 0) { samples.push(m.sample); } });
samples.forEach(function (s) { selSample.appendChild(el('option', {value: s}, s)); });
selSample.addEventListener('change', function () { var m = findModel(selSample.value, ''); if (m) { loadModel(m, freshState()); } });
selPlasmid.addEventListener('change', function () { var m = findModel(selSample.value, selPlasmid.value); if (m) { loadModel(m, freshState()); } });
models.forEach(function (m) {
  strip.appendChild(el('button', {type: 'button', 'class': 'pv-thumb', 'data-id': m.id, 'aria-label': 'Show ' + m.plasmid + ' from ' + m.sample, title: m.sample + ' / ' + m.plasmid + ', ' + m.length.toLocaleString('en-US') + ' bp',
    onclick: function () { loadModel(m, freshState()); }}, [el('span', {'class': 'pv-thumbimg'}), el('span', null, m.plasmid), el('span', {'class': 'pv-ts'}, m.sample)]));
});
function paintThumbs() {
  Array.prototype.forEach.call(strip.querySelectorAll('.pv-thumb'), function (b) {
    var m = null; models.forEach(function (x) { if (x.id === b.getAttribute('data-id')) { m = x; } });
    if (m) { b.querySelector('.pv-thumbimg').innerHTML = PV.thumbSvg(m, 72, S); }
  });
}
/* the page own colour-blind toggle sets data-cvd on the root element; the map follows it */
function pageCvd() { return document.documentElement.getAttribute('data-cvd') === '1' || document.documentElement.dataset.cvd === '1'; }
try {
  new MutationObserver(function () { var v = pageCvd(); if (S && S.cvd !== v) { S.cvd = v; legendBuilt = ''; paintThumbs(); renderPanelIf('appearance'); draw(); } }).observe(document.documentElement, {attributes: true, attributeFilter: ['data-cvd']});
} catch (e) { /* no observer */ }
window.addEventListener('hashchange', function () { var h = location.hash; if (h.indexOf('#plasmid-maps?') === 0) { applyHash(false); root.scrollIntoView({block: 'start'}); } });
window.addEventListener('resize', function () { hideTip(); });
if (prefs.panel === false) { main.classList.add('pv-nopanel'); }
S = PV.defaultState(); S.cvd = pageCvd(); S.labelSize = prefs.labelSize || 1; S.legend = prefs.legend !== false;
var hadHash = applyHash(true);
if (!hadHash) { var st0 = freshState(); st0.cvd = pageCvd() || st0.cvd; loadModel(models[0], st0, true); }

})();
