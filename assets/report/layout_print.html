<style id="rpt-layout-print">
/* Print and PDF (python/report_layout.py, python/export_report_pdf.py): every view, in order, each on a new page; no rail, top bar or
   interactive chrome; details expanded; info notes inline (report_common's rule); static figure fallbacks (each figure fragment's own rule). */
@page{size:A4 landscape;margin:13mm 11mm 15mm 11mm;
 @bottom-left{content:"PlasBench report";font:8pt Arial,Helvetica,sans-serif;color:#555}
 @bottom-right{content:"Page " counter(page) " of " counter(pages);font:8pt Arial,Helvetica,sans-serif;color:#555}}
@media print{
 html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{padding-top:0!important;font-size:10.5pt}
 .rpt-topbar,.rpt-rail,.rpt-toc,.rpt-nojs-links,#pb-prefs,.rpt-search,.controls,.rpt-controls,.rpt-chips,.pb-tab-bar{display:none!important}
 html.pb-js .rpt-shell,.rpt-shell{margin:0!important}
 .rpt-shell main{max-width:none;padding:0}
 .rpt-titleband{padding:0 0 8mm;border-bottom:2px solid #183a2d}
 .rpt-titleband h1{font-size:22pt}
 .rpt-kpis{flex:1 1 100%;max-width:100%}
 .rpt-kpis .metric{break-inside:avoid;min-width:0;flex:1 1 40mm}
 .rpt-cover{display:block;margin:8mm 0 0;break-after:page;page-break-after:always}
 .rpt-cover h2{font:700 14pt Arial,sans-serif;margin:0 0 4mm}
 .rpt-cover ol{columns:3 70mm;column-gap:8mm;margin:0;padding:0;list-style:none;font:9.5pt/1.4 Arial,sans-serif}
 .rpt-cover ol>li{break-inside:avoid;margin:0 0 3mm}
 .rpt-cover ul>li{margin:0}
 .rpt-cover li>b{display:block;font-size:10.5pt;margin-bottom:1mm}
 .rpt-cover ul{margin:0;padding:0 0 0 4mm;list-style:disc}
 .rpt-cover a{color:#17231d;text-decoration:none}
 /* every view prints, whichever is shown on screen */
 html.pb-js .rpt-view,html.pb-js .rpt-view.rpt-active,.rpt-view{display:block!important;margin:0}
 .rpt-view{break-before:page;page-break-before:always}
 .rpt-view-head{border-bottom:2px solid #183a2d;margin-bottom:5mm;break-after:avoid}
 .rpt-view-title{font-size:17pt}
 .rpt-body>section,.rpt-card-body>section{border:0;border-radius:0;padding:0;margin:0 0 7mm;break-inside:auto}
 .rpt-body>section:last-child{margin-bottom:0}
 .rpt-card{border:0;border-radius:0;margin:0 0 7mm;break-inside:auto}
 .rpt-card>summary{display:none}
 .rpt-card-body{padding:0}
 .rpt-card-body>section>h2{font:700 15pt Arial,sans-serif;color:#17231d;margin:0 0 3mm}
 h2,h3,h4,summary{break-after:avoid;page-break-after:avoid}
 details{display:block}
 details>summary{font-weight:700}
 details:not([open])>*:not(summary){display:block!important}
 details::details-content{content-visibility:visible;display:block}
 /* tables: wrap, fit the page, repeat the header, never split a row or cut off a column */
 .panel,.chart-card,.rpt-figure,.term-card,.sum-stat,.finding,.insight{box-shadow:none!important;overflow:visible!important}
 .panel{border:1px solid #aaa!important;max-width:100%}
 table{min-width:0!important;width:100%!important;table-layout:auto;font-size:8pt;border-collapse:collapse}
 th,td{white-space:normal!important;overflow-wrap:anywhere;padding:3px 5px!important}
 th{background:#e7eee8!important;font-size:7.5pt}
 thead{display:table-header-group}
 tr,img,svg,canvas,figure,.rpt-figure,.chart-card,.sum-stat,.finding,.insight,.selection-card,.metric{break-inside:avoid;page-break-inside:avoid}
 svg,canvas{max-width:100%;height:auto;max-height:160mm}
 .pv-stage,.pv-main,.pv-mapwrap,.lad-stage,.lad-fig,.ls-stage,.ls-stage-wrap{height:auto!important;min-height:0!important;max-height:none!important}
 iframe{max-width:100%;break-inside:avoid}
 .pv-root,.pv-main,.pv-stage,#pb-explorer-view,#cohort-evidence-explorer,.panel{break-inside:auto!important}
 .panel table{break-inside:auto}
 .rpt-info{display:block}
 a[href^="#"]::after{content:""}
 a{color:inherit;text-decoration:none}
 button,select,input[type=search],.rpt-actions{display:none}
 .lead,.muted{color:#333!important}
 .rpt-shell footer{margin-top:6mm}
}
</style>
