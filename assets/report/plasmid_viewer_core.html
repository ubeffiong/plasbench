/* ---------- numbers and basic geometry (ports of python/report_svg.py) ---------- */

function pt(p) { return num(p[0]) + ' ' + num(p[1]); }

};

    'A' + num(rOut) + ' ' + num(rOut) + ' 0 1 1 ' + num(cx - rOut) + ' ' + num(cy) + 'Z' +
    'M' + num(cx - rIn) + ' ' + num(cy) + 'A' + num(rIn) + ' ' + num(rIn) + ' 0 1 0 ' + num(cx + rIn) + ' ' + num(cy) +

/* ---------- classification helpers (class itself is decided in python and shipped in the payload) ---------- */

  return t.indexOf('relaxase') >= 0 || t.indexOf('mob') >= 0;

PV.makeView = function (len, start, span, minSpan) {
  if (minSpan === undefined) { minSpan = Math.min(len, 50); }

PV.relBp = function (view, bp) { return mod(bp - view.start, view.len); };

};
PV.originAt = function (view, bp) {
