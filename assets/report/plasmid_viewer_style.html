<style>
/* Interactive plasmid map viewer. The static maps (.pv-fallback) are the no-JavaScript fallback; the viewer hides them once it starts. */
#plasmid-maps.pv-on .pv-static[data-pv]{display:none}
#plasmid-maps details.pv-index{background:var(--card);border:1px solid var(--line);margin:10px 0;padding:0 14px}
.pv-root{margin:12px 0;font:13px/1.4 Arial,Helvetica,sans-serif;color:var(--ink);position:relative}
.pv-root[hidden]{display:none}
.pv-root *{box-sizing:border-box}
.pv-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px 10px 0 0;padding:10px 14px}
.pv-head label{display:flex;gap:6px;align-items:center;font-weight:700}
.pv-head select,.pv-root input[type=search],.pv-root input[type=number],.pv-root select{border:1px solid #b9c5bd;border-radius:6px;padding:5px 8px;font:13px Arial,sans-serif;background:#fff;color:var(--ink);max-width:100%}
.pv-tabbody input[type=search]{width:100%}
.pv-sum{color:var(--muted);flex:1 1 240px;min-width:200px}
.pv-btn{border:1px solid #b9c5bd;background:#fff;color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;font:600 12px Arial,sans-serif;line-height:1.2}
.pv-btn:hover{background:#eef4ef}
.pv-btn[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.pv-root :focus-visible{outline:3px solid #1a5fb4;outline-offset:2px}
.pv-strip{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:#eef3ee;border:1px solid var(--line);border-top:0;scrollbar-width:thin}
.pv-thumb{flex:0 0 auto;width:96px;border:2px solid transparent;border-radius:8px;background:#fff;padding:4px 2px 3px;cursor:pointer;text-align:center;font:11px/1.25 Arial,sans-serif;color:var(--ink)}
.pv-thumb:hover{border-color:#9bbba9}
.pv-thumb[aria-current=true]{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.pv-thumb span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-thumb .pv-ts{color:var(--muted);font-size:10px}
.pv-main{display:grid;grid-template-columns:minmax(0,1fr) 400px;border:1px solid var(--line);border-top:0;background:#fff;border-radius:0 0 10px 10px;overflow:hidden}
.pv-main.pv-nopanel{grid-template-columns:minmax(0,1fr)}
.pv-main.pv-nopanel .pv-panel{display:none}
.pv-stage{min-width:0;padding:8px 12px 10px;position:relative}
.pv-toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.pv-toolbar .pv-sp{flex:1}
.pv-toolbar .rpt-info{margin-left:0}
.pv-mapwrap{position:relative}
.pv-svg{display:block;width:100%;height:auto;max-height:84vh;touch-action:pan-y;cursor:grab;background:#fff;border-radius:6px;user-select:none;-webkit-user-select:none}
.pv-svg.pv-drag{cursor:grabbing}
.pv-svg [data-k]{cursor:pointer}
.pv-svg [data-k=gc],.pv-svg [data-k=skew]{cursor:crosshair}
.pv-svg path[data-k=g]:hover,.pv-svg path[data-k=t].cov:hover,.pv-svg line[data-k=e]:hover{stroke:#000;stroke-width:1.8}
.pv-svg text[data-k=g]:hover{text-decoration:underline}
.pv-mini{position:absolute;top:6px;right:6px;width:96px;height:96px;background:#ffffffd9;border:1px solid var(--line);border-radius:50%;cursor:pointer;padding:0}
.pv-mini svg{display:block;width:100%;height:100%}
.pv-view{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:8px;font-size:12px}
.pv-view input[type=range]{width:100%}
.pv-view input[type=number]{width:100px}
.pv-legend{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:8px}
.pv-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #b9c5bd;border-radius:14px;background:#fff;padding:3px 10px;font:12px Arial,sans-serif;cursor:pointer;color:var(--ink)}
.pv-chip i{display:inline-block;width:12px;height:12px;border:1px solid #0004;border-radius:2px}
.pv-chip[aria-pressed=false]{background:#f2f2f2;color:#6b6b6b;text-decoration:line-through}
.pv-chip[aria-pressed=false] i{opacity:.35}
.pv-key{display:inline-flex;align-items:center;gap:5px;font:12px Arial,sans-serif;color:var(--muted);margin-left:6px}
.pv-key i{display:inline-block;width:12px;height:12px;border:1px solid #0004}
.pv-panel{border-left:1px solid var(--line);background:#fbfcfb;position:relative;min-height:0}
.pv-panel-in{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.pv-tabs{display:flex;flex-wrap:wrap;gap:3px;padding:6px;border-bottom:1px solid var(--line);background:#f1f5f1}
.pv-tab{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 9px;cursor:pointer;font:600 12px Arial,sans-serif;color:var(--ink)}
.pv-tab:hover{background:#e3ece5}
.pv-tab[aria-selected=true]{background:var(--green);color:#fff}
.pv-tabbody{overflow:auto;padding:10px 12px 14px;flex:1;min-height:0}
.pv-tabbody h4{margin:12px 0 6px;font:700 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pv-tabbody h4:first-child{margin-top:0}
.pv-row{display:flex;align-items:center;gap:6px;margin:3px 0;flex-wrap:wrap}
.pv-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.pv-row input[type=range]{flex:1;min-width:90px}
.pv-tools-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff}
.pv-tools-list .pv-row{margin:2px 0}
.pv-cm{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.pv-root table{min-width:0;width:100%;font-size:11.5px;border-collapse:collapse}
.pv-root th,.pv-root td{white-space:normal;padding:4px 6px;text-align:left;vertical-align:top;border-top:1px solid var(--line);font-size:11.5px}
.pv-root th{background:#edf2ec;font-size:10.5px;text-transform:none;letter-spacing:0;position:sticky;top:0;z-index:1}
.pv-root th button{all:unset;cursor:pointer;font-weight:700}
.pv-root th button:focus-visible{outline:2px solid #1a5fb4}
.pv-root th[aria-sort=ascending] button::after{content:" \25B2";font-size:9px}
.pv-root th[aria-sort=descending] button::after{content:" \25BC";font-size:9px}
.pv-tw{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:6px;background:#fff}
.pv-root tbody tr.pv-r{cursor:pointer}
.pv-root tbody tr.pv-r:hover td{background:#f1f7f2}
.pv-root tbody tr.pv-r[aria-selected=true] td{background:#dcefdc;font-weight:700}
.pv-sw{display:inline-block;width:10px;height:10px;border:1px solid #0005;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pv-dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0;font-size:12.5px}
.pv-dl dt{color:var(--muted);font-weight:600}
.pv-dl dd{margin:0;word-break:break-word}
.pv-detail-h{font:700 16px Arial,sans-serif;margin:0 0 2px;display:flex;gap:6px;align-items:center}
.pv-muted{color:var(--muted)}
.pv-list{list-style:none;margin:4px 0;padding:0}
.pv-list li{margin:2px 0}
.pv-link{all:unset;cursor:pointer;color:#0b4f8a;text-decoration:underline}
.pv-link:focus-visible{outline:2px solid #1a5fb4}
.pv-tip{position:fixed;z-index:2147483000;max-width:330px;background:#14211b;color:#fff;border-radius:8px;padding:8px 10px;font:12px/1.35 Arial,sans-serif;pointer-events:none;box-shadow:0 4px 14px #0005}
.pv-tip[hidden]{display:none}
.pv-tip strong{display:block;font-size:13px;margin-bottom:3px}
.pv-tip dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:0}
.pv-tip dt{color:#b8cbc0}
.pv-tip dd{margin:0}
.pv-live{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pv-note{font-size:12px;color:var(--muted);margin:6px 0}
.pv-empty{padding:14px;color:var(--muted)}
@media (max-width:960px){
 .pv-main{grid-template-columns:minmax(0,1fr)}
 .pv-panel{border-left:0;border-top:1px solid var(--line)}
 .pv-panel-in{position:static;max-height:75vh}
 .pv-mini{width:72px;height:72px}
 .pv-view{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.pv-root *{transition:none!important;animation:none!important}}
@media print{
 .pv-panel,.pv-head,.pv-strip,.pv-toolbar,.pv-view,.pv-mini,.pv-hint,.pv-tip{display:none!important}
 .pv-main{display:block;border:0}
 .pv-svg{max-height:none}
 .pv-legend{display:flex}
 .pv-chip[aria-pressed=false]{display:none}
}
</style>
