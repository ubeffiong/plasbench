/* Layout shared with the static SVG: viewBox 760 x 640, plot area inside the margins. */
PR.L = {W: 760, H: 640, ml: 62, mr: 20, mt: 18, mb: 56};
PR.scale = function (view) {
  var L = PR.L, pw = L.W - L.ml - L.mr, ph = L.H - L.mt - L.mb;

    x: function (r) { return L.ml + (r - view[0]) / (view[1] - view[0]) * pw; },
    y: function (p) { return L.mt + (1 - (p - view[2]) / (view[3] - view[2])) * ph; },
