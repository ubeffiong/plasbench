[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasbench"
version = "0.1.8"
description = "Benchmark plasmid-reconstruction tools against complete-reference truth."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Ubokobong Effiong"}]
keywords = ["bioinformatics", "plasmid", "benchmarking", "genomics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
plasbench = "plasbench.cli:main"
# Per-step entry points. Galaxy (and CWL/Nextflow/Snakemake) call one step at a
# time and may only invoke a command on PATH, never an absolute path inside a
# container image -- see plasbench/tools.py.
plasbench-score = "plasbench.tools:score_main"
plasbench-aggregate = "plasbench.tools:aggregate_main"

[project.urls]
Homepage = "https://github.com/ubeffiong/plasbench"
Repository = "https://github.com/ubeffiong/plasbench"
Issues = "https://github.com/ubeffiong/plasbench/issues"

[tool.setuptools]
packages = ["plasbench"]
