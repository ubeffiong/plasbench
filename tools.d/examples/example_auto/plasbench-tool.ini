# format = auto: PlasBench recognises what the tool wrote BY CONTENT instead of you describing every file.
# Modelled on MOB-recon, which writes a contig report table and one FASTA per plasmid.
[tool]
name = example_auto
display_name = Example auto-detected tool
task = binning_reconstruction, classification, sequence_reassembly
analysis_track = short_read
description = Writes a contig table plus plasmid FASTA files (example manifest).

[install]
method = none                        # already on PATH

[run]
mode = command
command = exampleauto -i {contigs} -o {outdir} -n {threads}
requires = contigs

[output]
format = auto
# Files or folders relative to {outdir}. Each is classified by content:
#   FASTA file -> plasmid_fasta; folder of FASTA files (or a pattern matching several) -> fasta_dir;
#   table with a contig column and a bin/cluster column -> contig_bins; with a label or probability column -> contig_labels.
# Per task the best available one is used (binning <- bins, then labels; classification <- labels, then bins; reassembly <- FASTA).
# Two candidates that serve the same task equally, or nothing recognisable, is an ERROR that lists what was seen; and the choice
# made for every sample is recorded in pred_<tool>.<tool>.provenance.json and in the tool-status reason.
candidates = contig_report.txt, plasmid_*.fasta
# Hints that win over detection, only if you need them:
# [output.contig_bins]  contig_column = contig_id   bin_column = primary_cluster_id   bin_none_values = -
