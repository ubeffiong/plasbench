# A plasmid BINNING tool that PlasBench runs: it reads the assembly graph and writes one row per contig with its bin.
[tool]
name = example_contig_bins
display_name = Example binner
task = reconstruction                # groups contigs into plasmids: bin-level metrics and CPRR apply
analysis_track = short_read
description = Graph-based plasmid binning (example manifest).
citation = Author et al. (2025) Journal. doi:10.0000/example
version_command = examplebinner --version

[install]
method = conda
packages = examplebinner=1.4.2
channels = conda-forge, bioconda
verify_command = examplebinner --help

[database]
uses_reference_database = no

[run]
mode = command
# {graph} and {contigs} are the sample's own assembly; {outdir} is an empty folder for this tool and sample.
# A long command may continue on indented lines.
command = examplebinner --gfa {graph} --contigs {contigs}
    --threads {threads} --out {outdir}/run
requires = graph, contigs
timeout_seconds = 7200

[output]
format = contig_bins
path = run/bins.tsv                  # relative to {outdir}
delimiter = tab
header = yes
contig_column = contig_id            # by name, or a 1-based column number
bin_column = plasmid_bin
# The tool writes "NODE_1_length_5000_cov_12.3" where the assembly says "NODE_1": keep the ids identical.
contig_id_strip_regex = _length_.*$
