# A plasmid/chromosome CLASSIFIER with a probability per contig; its outputs were produced beforehand (import mode).
[tool]
name = example_contig_labels
display_name = Example classifier
task = classification                # labels contigs: base-level F1 and PR-AUC apply, no bins
analysis_track = short_read
description = Machine-learning contig classifier (example manifest).

[install]
method = none                        # nothing to install: PlasBench only reads the files below

[database]
uses_reference_database = yes        # it searches a plasmid database: PlasBench checks for truth leakage
database = PLSDB 2023_11_03_v2
release_date = 2023-11-03

[run]
mode = import
dir = /data/my_classifier_outputs    # one file per sample, made from the SAME assemblies PlasBench scores
pattern = {sample}.csv

[output]
format = contig_labels
delimiter = comma
header = yes
contig_column = contig
label_column = prediction
plasmid_values = plasmid, Plasmid, 1 # values of label_column that mean "plasmid"
score_column = plasmid_probability   # in [0, 1]; adds the PR curve. Without label_column, score >= threshold is plasmid
threshold = 0.5
contig_id_from = first_token         # "contig_7 len=4512" -> "contig_7"
