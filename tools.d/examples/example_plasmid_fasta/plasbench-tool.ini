# A tool that writes predicted plasmid SEQUENCE (no contig ids), e.g. a plasmid assembler run on the short reads.
[tool]
name = example_plasmid_fasta
display_name = Example plasmid assembler
task = reconstruction                # each FASTA record is one predicted plasmid
analysis_track = short_read
version_command = exampleasm --version

[install]
method = pip
pip_packages = exampleasm==0.9.1
python = 3.10
verify_command = exampleasm --help

[run]
mode = command
command = exampleasm -1 {reads_1} -2 {reads_2} -o {outdir} -t {threads}
requires = reads_1, reads_2

[output]
format = plasmid_fasta
path = plasmids.fasta
