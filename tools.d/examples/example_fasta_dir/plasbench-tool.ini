# A long-read tool that writes ONE FASTA FILE PER PLASMID into a folder.
[tool]
name = example_fasta_dir
display_name = Example long-read reconstructor
task = reconstruction
analysis_track = long_read
# Long-read and hybrid tools are skipped on a sample whose truth assembly was built from the same long reads, unless
# the sample sheet declares truth_independent_of_long_reads=yes (EXAMPLE_FASTA_DIR_ALLOW_CIRCULAR_TRUTH=1 overrides).
# "auto" (the default) applies this to long_read and hybrid tools; yes or no sets it explicitly.
requires_independent_long_read_truth = auto

[install]
method = script                      # anything conda/pip cannot do: a script shipped beside this manifest
script = install.sh                  # called as: install.sh <environment name>
verify_command = examplelr --help

[run]
mode = command
command = examplelr --reads {long_reads} --out {outdir}/plasmids --threads {threads}
requires = long_reads

[output]
format = fasta_dir
path = plasmids                      # the folder; each file is one predicted plasmid (bin)
fasta_glob = *.fasta, *.fa
