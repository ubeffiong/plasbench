# ONE tool, SEVERAL tasks. The command runs once per sample; PlasBench then converts the same output for each task.
# The tool appears in each task's own leaderboard ("Example multi-task tool (classification)", "... (binning)"), never ranked across tasks.
[tool]
name = example_multi_task
display_name = Example multi-task tool
# A comma list. The first one is the primary task (it keeps the name example_multi_task); the others are example_multi_task__binning_reconstruction etc.
task = classification, binning_reconstruction
analysis_track = short_read
description = Writes a bins table and a labels table (example manifest).

[install]
method = conda
packages = examplemulti=2.0
verify_command = examplemulti --help

[run]
mode = command
command = examplemulti --contigs {contigs} --gfa {graph} --out {outdir} --threads {threads}
requires = contigs, graph

[output]
# Several output types: each has its own [output.<format>] section. For every task PlasBench uses the best one that serves it:
#   classification   <- contig_labels (native), else contig_bins (a contig in any bin is plasmid)
#   binning          <- contig_bins (native), else contig_labels (one flagged bin per plasmid contig)
# A task that cannot be produced from the declared types is a validation error that says what to add
# (plasmid_fasta / fasta_dir only serve sequence_reassembly).
format = contig_bins, contig_labels

[output.contig_bins]
path = bins.tsv                      # relative to {outdir}
contig_column = contig
bin_column = plasmid_bin

[output.contig_labels]
path = labels.csv
delimiter = comma
contig_column = contig
label_column = prediction
plasmid_values = plasmid
score_column = plasmid_probability   # in [0, 1]: gives classification its PR curve
