# Any other output: ship a small adapter that writes PlasBench's native files (adapters/BINS.md, adapters/SCORES.md).
[tool]
name = example_adapter
display_name = Example custom-output tool
task = reconstruction
analysis_track = short_read

[install]
method = none

[run]
mode = command
command = exampletool {contigs} > {outdir}/result.json
requires = contigs

[output]
format = adapter
path = result.json
adapter = adapt.py                   # called as: adapt.py <tool output> <assembly contigs> <pred_<tool>.plasmid.fasta>
