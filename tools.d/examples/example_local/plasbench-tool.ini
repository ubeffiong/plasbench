# A tool that is ALREADY ON THIS COMPUTER (a folder or a file). Installing copies it beside this manifest.
[tool]
name = example_local
display_name = Example local tool
task = sequence_reassembly
analysis_track = short_read
description = A plasmid assembler built locally by the researcher (example manifest).

[install]
method = local
path = ~/tools/examplelocal          # a file or a folder; '~', $VARS and Windows paths (C:\Tools\examplelocal) work
# mode = copy (the default) copies it and records its checksum (a tree checksum for a folder), so the benchmark is reproducible.
# mode = link uses it in place and records only the path: PlasBench warns, because the tool can change under the benchmark.
mode = copy
# build_command = make               # optional; runs inside the copied folder
verify_command = {src}/bin/examplelocal --help

[run]
mode = command
command = {src}/bin/examplelocal -1 {reads_1} -2 {reads_2} -o {outdir} -t {threads}
requires = reads_1, reads_2

[output]
format = plasmid_fasta
path = plasmids.fasta
